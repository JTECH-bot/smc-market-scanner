name: "LSE Smart Signal Scanner v12.53.2 \u2014 9-strategy genuine-entry + LSE top-of-book validation"
permissions:
  contents: read
concurrency:
  group: lse-smart-scanner-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'LIVE' || inputs.scan_mode || 'ONCE' }}
  cancel-in-progress: true
jobs:
  validate_workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Validate YAML, duplicate keys, and embedded Python before LSE access
      run: "set -euo pipefail\npython -m pip install --disable-pip-version-check \"PyYAML>=6.0,<7\"\npython - <<'PY'\nimport ast\nimport os\nimport re\nfrom pathlib import Path\nimport yaml\nclass DuplicateKeyLoader(yaml.SafeLoader):\n    pass\ndef construct_mapping(loader, node, deep=False):\n    mapping = {}\n    for key_node, value_node in node.value:\n        key = loader.construct_object(key_node, deep=deep)\n        if key in mapping:\n            raise ValueError(\n                f\"Duplicate YAML key {key!r} at line {key_node.start_mark.line + 1}\"\n            )\n        mapping[key] = loader.construct_object(value_node, deep=deep)\n    return mapping\nDuplicateKeyLoader.add_constructor(\n    yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,\n    construct_mapping,\n)\nworkflow_ref = os.environ.get(\"GITHUB_WORKFLOW_REF\", \"\")\nworkflow = None\nmarker = \".github/workflows/\"\nif marker in workflow_ref:\n    candidate = workflow_ref.split(marker, 1)[1].split(\"@\", 1)[0]\n    path\
        \ = Path(\".github/workflows\") / candidate\n    if path.is_file():\n        workflow = path\nif workflow is None:\n    candidates = sorted(Path(\".github/workflows\").glob(\"*.yml\")) + sorted(Path(\".github/workflows\").glob(\"*.yaml\"))\n    matches = []\n    for candidate in candidates:\n        try:\n            candidate_text = candidate.read_text(encoding=\"utf-8\")\n        except OSError:\n            continue\n        if (\n            \"LSE Smart Signal Scanner\" in candidate_text\n            and \"from lse import LSE\" in candidate_text\n            and \"FAST FILTER -> DEEP ANALYSIS\" in candidate_text\n        ):\n            matches.append(candidate)\n    if len(matches) != 1:\n        raise SystemExit(\n            f\"Expected exactly one current LSE scanner workflow, found {len(matches)}: {matches}\"\n        )\n    workflow = matches[0]\nsource = workflow.read_text(encoding=\"utf-8\")\nworkflow_bytes = workflow.stat().st_size\nassert workflow_bytes < 500_000, f\"\
        Workflow file must stay below 500,000 bytes; current size is {workflow_bytes} bytes\"\ndoc = yaml.load(source, Loader=DuplicateKeyLoader)\nassert isinstance(doc, dict), \"Workflow root must be a mapping\"\njobs = doc.get(\"jobs\")\nassert isinstance(jobs, dict), \"jobs mapping missing\"\nfor required in (\"validate_workflow\", \"tca_replay\", \"deep_history\", \"e2e_replay\", \"scan\"):\n    assert required in jobs, f\"Missing job: {required}\"\nscan_env = jobs[\"scan\"].get(\"env\", {})\nassert list(scan_env).count(\"RUN_E2E\") == 1, \"RUN_E2E must have exactly one authoritative scan-env definition\"\nassert \"RUN_E2E\" in scan_env\nassert \"RUN_E2E\" not in jobs[\"tca_replay\"].get(\"env\", {}), \"TCA must not define a second RUN_E2E switch\"\nassert jobs[\"tca_replay\"].get(\"needs\") == [\"validate_workflow\"]\nassert jobs[\"e2e_replay\"].get(\"needs\") == [\"validate_workflow\", \"tca_replay\", \"deep_history\"]\nassert \"validate_workflow\" in jobs[\"scan\"].get(\"needs\",\
        \ [])\nassert (\"on\" in doc) or (True in doc), \"GitHub workflow trigger block is missing\"\nscan_if = str(jobs[\"scan\"].get(\"if\", \"\"))\nassert \"always()\" in scan_if and \"needs.tca_replay.result\" in scan_if and \"needs.e2e_replay.result\" in scan_if, \"Scan must explicitly allow skipped optional replay jobs\"\ntext = source\ndef step_by_name(job_name, step_name):\n    job_steps = jobs[job_name].get(\"steps\", [])\n    matches = [s for s in job_steps if s.get(\"name\") == step_name]\n    assert len(matches) == 1, f\"Expected exactly one step named {step_name!r} in {job_name}, found {len(matches)}\"\n    return matches[0]\ntca_history_step = step_by_name(\"tca_replay\", \"Historical tick replay + execution TCA\")\ntca_preflight_step = step_by_name(\"tca_replay\", \"LSE API key and data-access preflight\")\ne2e_replay_step = step_by_name(\"e2e_replay\", \"Historical 9-strategy end-to-end replay\")\nscan_runs = \"\\n\".join(\n    s.get(\"run\", \"\") for s in jobs[\"scan\"\
        ].get(\"steps\", [])\n    if isinstance(s.get(\"run\"), str)\n)\ntca_run_source = str(tca_history_step.get(\"run\", \"\"))\ne2e_run_source = str(e2e_replay_step.get(\"run\", \"\"))\nassert e2e_run_source, \"E2E replay step source is empty\"\nassert (\n    \"start=api_date(query_start)\" in tca_run_source\n    or '\"start\": api_date(query_start)' in tca_run_source\n), \"TCA history start must be bound to query_start\"\nassert (\n    \"end=api_date(query_end + timedelta(days=1))\" in tca_run_source\n    or '\"end\": api_date(query_end + timedelta(days=1))' in tca_run_source\n), \"TCA history end must be bound to query_end + 1 day\"\nassert \"HISTORY_MAX_RETRIES = 0\" in tca_run_source\nassert \"TICK_HISTORY_FLOOR\" not in tca_run_source, \"TCA must not impose an artificial one-year tick-history floor\"\nassert jobs[\"tca_replay\"].get(\"env\", {}).get(\"TCA_MAX_VAULT_EXPORTS\") == \"4\", \"TCA vault export safety cap must be 4\"\nassert \"catalog-span\" in tca_run_source or \"catalog_meta\"\
        \ in tca_run_source, \"Catalog-driven TCA history policy missing\"\nassert 'client.datasets(\"crypto\")' in tca_run_source, \"LSE crypto dataset discovery missing\"\nassert \"client._vault_call(\\\"/usage\\\")\" in tca_run_source, \"LSE vault usage preflight missing\"\nassert \"EXPORT_BUDGET_CAPPED\" in tca_run_source, \"Controlled export-cap state missing\"\nassert \"rows_from_result\" in e2e_run_source\nassert \"insufficient valid EMA closes\" in scan_runs, \"EMA pullback must tolerate null/invalid historical closes\"\nassert 'ns[\"strategy_catalog\"](data,symbol,{})' in e2e_run_source or \"strategy_signals(data[tf],category)\" in e2e_run_source, \"Historical institutional engine reconstruction missing\"\nassert \"historical_decision_count\" in e2e_run_source, \"Historical setup evaluation counter missing\"\nassert '\"historical_reconstruction\"' in e2e_run_source, \"Historical reconstruction report missing\"\nassert \"rows_from_history\" not in e2e_run_source\nassert \"client.history(\"\
        \ not in e2e_run_source, \"E2E must not issue a second LSE vault history export\"\nassert \"if len(ticks)<100: raise RuntimeError\" not in e2e_run_source, \"Missing tick tape must not block historical setup reconstruction\"\nassert \"TCA is the single LSE vault-history export owner\" in e2e_run_source, \"TCA/E2E single-owner handoff missing\"\nassert \"DEEP_HISTORY_START\" in e2e_run_source, \"Deep-history start handoff missing\"\nassert \"deep_history_manifest.json\" in e2e_run_source, \"Deep-history artifact handoff missing\"\nassert \"resample_5m_to_timeframe\" in e2e_run_source, \"Deep-history timeframe reconstruction missing\"\nassert \"DEEP_DECISION_STEP_MINUTES\" in e2e_run_source, \"Deep decision pacing missing\"\nassert \"EXPORT_BUDGET_CAPPED\" in e2e_run_source, \"E2E export-cap handoff missing\"\nassert \"NO_BID_ASK_FIELDS_IN_DATASET\" in tca_run_source, \"Price-only LSE datasets must be distinguished from missing data\"\nassert \"best_quote_candidate\" in tca_run_source\
        \ and \"highest_valid_bid_ask_density\" in tca_run_source, \"TCA quote-source resolver must select by validated bid/ask density\"\nassert '\"potential_entry\"' in e2e_run_source and '\"trigger_price\"' in e2e_run_source and '\"candle_outcome\"' in e2e_run_source, \"E2E potential-entry price-path fields missing\"\nassert '\"signal_type\"' in scan_runs and '\"potential_entry\"' in scan_runs, \"Scanner must expose explicit potential BUY/SELL entry fields\"\nassert \"quote_dataset_candidates\" in tca_run_source and \"TCA BTC/USD QUOTE SOURCE SELECTED\" in tca_run_source, \"BTC quote-dataset fallback missing\"\nassert \"HISTORY_EXPORT_EMPTY\" in tca_run_source, \"Empty history exports need a distinct diagnostic\"\nassert \"HISTORY_EXPORT_FAILED\" in tca_run_source, \"History export failures need a distinct diagnostic\"\nassert \"tick_history_diagnostics.json\" in tca_run_source, \"Dedicated bid/ask diagnostic artifact missing\"\nassert \"TCA_ROOT_CAUSE\" in e2e_run_source, \"E2E must\
        \ surface the TCA bid/ask root cause\"\nassert \"tca_period_start\" in e2e_run_source and \"tca_period_end\" in e2e_run_source, \"E2E must import the exact TCA-resolved period\"\nassert \"E2E TCA WINDOW HANDOFF\" in e2e_run_source, \"Exact TCA-to-E2E window handoff diagnostic missing\"\nassert \"PARTIAL_EXECUTION_DATA\" in e2e_run_source, \"E2E partial execution-data state missing\"\nassert \"preflight_catalog_request=SKIPPED\" in tca_preflight_step[\"run\"], \"Preflight must not consume catalog quota\"\nassert \"catalog_api_calls_in_tca\" in tca_run_source, \"TCA catalog snapshot policy missing\"\nassert \"TCA_REST_MIN_INTERVAL_SECONDS\" in tca_run_source, \"TCA REST governor missing\"\nassert \"tca_qualification_diagnostics.json\" in tca_run_source, \"TCA qualification diagnostic artifact missing\"\nassert \"TCA PREDICTION REPORT\" in tca_run_source, \"TCA prediction report output missing\"\nassert \"prediction_summary\" in tca_run_source, \"TCA prediction summary missing\"\nassert\
        \ \"prediction_state_counts\" in tca_run_source, \"TCA prediction state counts missing\"\nassert \"DATA_AVAILABLE_NO_FILLED_OBSERVATIONS\" in tca_run_source, \"TCA must distinguish zero fills from missing data\"\nassert \"historical_symbol_diagnostics\" in tca_run_source, \"Per-symbol historical setup diagnostics missing\"\nassert \"setup_primary_bottleneck\" in tca_run_source and \"execution_primary_bottleneck\" in tca_run_source, \"Setup and execution bottlenecks must be separated\"\nassert \"candle/setup reconstruction remains valid; execution/TCA is data-limited\" in tca_run_source, \"Tick-data limitation must not suppress candle/setup reconstruction\"\nassert \"if tick_i >= len(ticks):\\n                    break\" not in tca_run_source, \"TCA must not stop candle qualification when the tick tape ends\"\nassert \"potential_buy\" in tca_run_source and \"potential_sell\" in tca_run_source, \"Historical potential BUY/SELL diagnostics missing\"\nassert 'ENTRY_BUFFER_ATR\",ENTRY_BUFFER_ATR'\
        \ in tca_run_source, \"TCA must use the authoritative ENTRY_BUFFER_ATR\"\nassert '\"evidence_state\"' in tca_run_source, \"TCA calibration evidence state missing\"\nassert \"RATE_LIMITED\" in tca_run_source and \"circuit OPEN\" in tca_run_source, \"TCA 429 circuit breaker missing\"\nassert \"FAST_DATA_CACHE\" in scan_runs and \"reused fast-filter cache\" in scan_runs, \"Scanner fast/deep candle cache missing\"\nassert \"CANDLE_RESPONSE_CACHE\" in scan_runs, \"Scanner per-run candle response cache missing\"\nassert 'FAST_FETCH_LIMIT = {\"1h\": 320, \"15m\": 420, \"5m\": 600}' in scan_runs, \"Fast fetch limits must cover deep minimum history to avoid duplicate candle requests\"\nassert \"EMPTY_HISTORY_RESPONSE\" in tca_run_source, \"Empty vault history responses need an explicit diagnostic\"\nassert \"DEEP_5M_CANDLE_RECONSTRUCTION\" in e2e_run_source, \"E2E price-path fallback evidence mode missing\"\nassert \"No synthetic bid/ask\" in e2e_run_source, \"E2E must explicitly prohibit\
        \ synthetic bid/ask execution evidence\"\nassert \"normalize_price_ticks\" in tca_run_source, \"Raw price-tick evidence normalizer missing\"\nassert \"isinstance(v, (int, float))\" in e2e_run_source, \"E2E WebSocket numeric Unix timestamp parsing missing\"\nassert \"datetime.fromtimestamp(float(v), tz=timezone.utc)\" in e2e_run_source, \"E2E Unix-seconds timestamp conversion missing\"\nassert \"bid={getattr(tick,'bid',None)!r}\" in e2e_run_source, \"WebSocket bid diagnostic missing\"\nassert \"ask={getattr(tick,'ask',None)!r}\" in e2e_run_source, \"WebSocket ask diagnostic missing\"\nassert \"LSE API key and data-access preflight\" in tca_preflight_step[\"name\"], \"LSE API key preflight missing\"\nassert \"LSE API KEY STATUS: INVALID\" in tca_preflight_step[\"run\"], \"Explicit invalid-key diagnostic missing\"\nassert \"E2E_MIN_TICKS\" in e2e_run_source, \"E2E minimum-tick constant missing\"\nassert \"MIN_CONFIRMED_RR\" in e2e_run_source, \"E2E authoritative RR constant handoff\
        \ missing\"\nassert \"E2E authoritative MIN_CONFIRMED_RR must be >= 2.0\" in e2e_run_source, \"E2E must fail clearly if authoritative RR extraction breaks\"\nassert \"E2E authoritative ENTRY_BUFFER_ATR must be > 0\" in e2e_run_source, \"E2E must fail clearly if authoritative entry-buffer extraction breaks\"\nassert \"ENTRY_BUFFER_ATR = float(ns[\\\"ENTRY_BUFFER_ATR\\\"])\" in e2e_run_source, \"E2E must bind entry buffer from authoritative scanner extraction\"\nassert \"if rr < MIN_CONFIRMED_RR\" in e2e_run_source, \"E2E RR gate must use authoritative scanner constant\"\nassert \"vault_raw_price_count >= MIN_TICKS\" not in e2e_run_source, \"E2E still references undefined TCA MIN_TICKS\"\nassert 'timeframe=\"tick\"' not in tca_run_source, \"Raw tick history must use documented history() semantics without a candle timeframe\"\nassert \"vault_valid_count=0\" in tca_run_source, \"TCA vault_valid_count must be initialized before branch-local use\"\n\
        assert \"vault_raw_price_count=0\" in tca_run_source, \"TCA vault_raw_price_count must be initialized before branch-local use\"\ntotal_python = 0\nfor job_name, job in jobs.items():\n    for step_index, step in enumerate(job.get(\"steps\", [])):\n        run = step.get(\"run\")\n        if not isinstance(run, str):\n            continue\n        for match in re.finditer(\n            r\"python\\s+-\\s+<<['\\\"]?PY['\\\"]?\\n(.*?)\\nPY(?:\\n|$)\",\n            run,\n            flags=re.S,\n        ):\n            code = match.group(1)\n            filename = f\"{workflow}:{job_name}:step{step_index}\"\n            ast.parse(code, filename=filename)\n            compile(code, filename, \"exec\")\n            total_python += 1\nassert total_python >= 8, f\"Expected embedded Python validation coverage; found {total_python}\"\nprint(f\"WORKFLOW VALIDATION PASS | {workflow}\")\nprint(\"YAML duplicate-key check: PASS\")\nprint(\"Dependency/preflight ordering: PASS\")\nprint(\"LSE catalog-span\
        \ + crypto-dataset discovery policy: PASS\")\nprint(\"429 circuit breaker: PASS\")\nprint(\"E2E history normalizer: PASS\")\nprint(f\"Embedded Python AST/compile checks: PASS ({total_python} blocks)\")\nPY\n"
    - name: Build shared replay helper module
      run: "set -euo pipefail\ncat > replay_common.py <<'PY'\nfrom datetime import datetime, timezone\n\ndef now_utc():\n    return datetime.now(timezone.utc)\n\ndef tick_field(tick, *names):\n    \"\"\"Read SDK Tick fields robustly across object/dict/case variants.\"\"\"\n    candidates = {str(n).lower() for n in names}\n    if isinstance(tick, dict):\n        for k, v in tick.items():\n            if str(k).strip().lower() in candidates:\n                return v\n        for nested_name in (\"fields\", \"data\", \"quote\"):\n            nested = tick.get(nested_name)\n            if isinstance(nested, dict):\n                for k, v in nested.items():\n                    if str(k).strip().lower() in candidates:\n                        return v\n    for name in names:\n        try:\n            value = getattr(tick, name)\n            if value is not None:\n                return value\n        except Exception:\n            pass\n    return None\n\ndef tick_bool(tick, *names):\n  \
        \  value = tick_field(tick, *names)\n    if isinstance(value, bool):\n        return value\n    if value is None:\n        return None\n    return str(value).strip().lower() in {\"true\", \"1\", \"yes\", \"y\", \"replay\"}\n\ndef tick_to_row(tick, fnum, parse_ts):\n    ts = tick_field(tick, \"timestamp\", \"datetime\", \"time\", \"date\")\n    bid = fnum(tick_field(tick, \"bid\", \"BID\", \"bid_price\", \"best_bid\", \"bidprice\", \"bid_1\"))\n    ask = fnum(tick_field(tick, \"ask\", \"ASK\", \"ask_price\", \"best_ask\", \"askprice\", \"ask_1\"))\n    price = fnum(tick_field(tick, \"price\", \"last\", \"last_price\", \"trade_price\", \"mid\", \"mid_price\"))\n    volume = fnum(tick_field(tick, \"volume\", \"size\", \"trade_size\")) or 0.0\n    if ts is None or bid is None or ask is None or bid <= 0 or ask <= 0 or ask < bid:\n        return None\n    try:\n        dt = parse_ts(ts)\n    except Exception:\n        return None\n    return {\"timestamp\":dt,\"bid\":bid,\"ask\":ask,\n\
        \            \"price\":price if price is not None else (bid+ask)/2.0,\"volume\":volume}\nPY\n"
    - name: Build canonical replay scanner module
      run: "set -euo pipefail\npython - <<'PY'\nimport ast, re, yaml\nfrom pathlib import Path\nimport os\nworkflow_ref=os.environ.get(\"GITHUB_WORKFLOW_REF\",\"\")\nworkflow=None\nif \".github/workflows/\" in workflow_ref:\n    candidate=workflow_ref.split(\".github/workflows/\",1)[1].split(\"@\",1)[0]\n    p=Path(\".github/workflows\")/candidate\n    if p.is_file(): workflow=p\nif workflow is None:\n    matches=[]\n    for p in sorted(Path(\".github/workflows\").glob(\"*.yml\"))+sorted(Path(\".github/workflows\").glob(\"*.yaml\")):\n        try: text=p.read_text(encoding=\"utf-8\")\n        except OSError: continue\n        if \"LSE Smart Signal Scanner\" in text and \"nine_strategy_signals\" in text and \"from lse import LSE\" in text: matches.append(p)\n    if len(matches)!=1: raise SystemExit(f\"Expected exactly one scanner workflow, found {len(matches)}: {matches}\")\n    workflow=matches[0]\ndoc=yaml.safe_load(workflow.read_text(encoding=\"utf-8\"))\nsteps=doc.get(\"jobs\",{}).get(\"\
        scan\",{}).get(\"steps\",[])\nrun_blocks=[s.get(\"run\",\"\") for s in steps if isinstance(s,dict) and s.get(\"name\")==\"Run scanner\" and isinstance(s.get(\"run\"),str)]\nif len(run_blocks)!=1: raise SystemExit(f\"Canonical scanner source requires exactly one Run scanner step; found {len(run_blocks)}\")\nblocks=re.findall(r\"python\\s+-\\s+<<[\\'\\\"]?PY[\\'\\\"]?\\r?\\n(.*?)\\r?\\nPY(?:\\r?\\n|$)\",run_blocks[0],flags=re.S)\n# Version-independent scanner identity: derive identity from stable code structure, never from the workflow version/banner.\nrequired_imports=(\"from lse import LSE\",)\nrequired_functions=(\"nine_strategy_signals\",\"strategy_catalog\",\"strategy_summary\",\"dominant\",\"now_utc\")\nrequired_markers=(\"FAST FILTER -> DEEP ANALYSIS\",)\ndef is_scanner_block(block):\n    if not all(m in block for m in required_imports + required_markers):\n        return False\n    try:\n        tree=ast.parse(block)\n    except SyntaxError:\n        return False\n    functions={n.name\
        \ for n in tree.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))}\n    return set(required_functions).issubset(functions)\ncandidates=[b for b in blocks if is_scanner_block(b)]\nif len(candidates)!=1: raise SystemExit(f\"Canonical scanner extraction failed; version-independent candidates={len(candidates)}\")\ntree=ast.parse(candidates[0])\nallowed=[]\nallowed_assigns={\"TF\",\"MIN_BARS\",\"FETCH_LIMIT\",\"FAST_FETCH_LIMIT\",\"ENTRY_HORIZONS\",\"POSITION_TIMEFRAME_PROFILES\",\"POSITION_TIMEFRAMES\",\"TRIGGER_SWING_LOOKBACK\",\"TRIGGER_SWING_WINDOW\",\"ENTRY_BUFFER_ATR\",\"ENTRY_MAX_CHASE_ATR\",\"SYMBOL_ALIASES\",\"MIN_CONFIRMED_RR\"}\nfor node in tree.body:\n    if isinstance(node,(ast.Import,ast.ImportFrom,ast.FunctionDef,ast.AsyncFunctionDef)): allowed.append(node)\n    elif isinstance(node,ast.Assign) and all(isinstance(t,ast.Name) for t in node.targets) and any(t.id in allowed_assigns for t in node.targets): allowed.append(node)\nmod=ast.Module(body=allowed,type_ignores=[])\n\
        ast.fix_missing_locations(mod)\ncode=ast.unparse(mod)+\"\\n\"\nPath(\"replay_scanner.py\").write_text(code,encoding=\"utf-8\")\ncompile(code,\"replay_scanner.py\",\"exec\")\nprint(\"Canonical replay scanner extraction: PASS | version-independent structural identity | blocks=1\")\nPY"
    - name: Upload shared replay helper module
      uses: actions/upload-artifact@v4
      with:
        name: lse-replay-common
        path: replay_common.py
        if-no-files-found: error
        retention-days: 1
    - name: Upload canonical replay scanner module
      uses: actions/upload-artifact@v4
      with:
        name: replay-scanner
        path: replay_scanner.py
        if-no-files-found: error
        retention-days: 1
  scan:
    needs:
    - validate_workflow
    - tca_replay
    - e2e_replay
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 70
    env:
      LSE_API_KEY: ${{ secrets.LSE_API_KEY }}
      MAX_INSTRUMENTS: ${{ inputs.max_instruments || '0' }}
      SCAN_RUNTIME_MINUTES: ${{ inputs.runtime_minutes || '8' }}
      LSE_CATEGORIES: ${{ inputs.categories || 'forex,commodity,crypto' }}
      TOP_N: ${{ inputs.top_n || '5' }}
      SCAN_MODE: ${{ inputs.scan_mode || 'ONCE' }}
      UNTIL_POSITION_MAX_MINUTES: ${{ inputs.until_position_max_minutes || '55' }}
      POLL_SECONDS: '30'
      FAST_CANDIDATE_LIMIT: ${{ inputs.fast_candidate_limit || '28' }}
      FAST_MIN_SCORE: ${{ inputs.fast_min_score || '50' }}
      RUN_TCA: ${{ inputs.run_tca || 'false' }}
      RUN_E2E: ${{ inputs.run_e2e || 'false' }}
      TCA_SYMBOLS: BTC/USD,EUR/USD,GBP/USD,XAU/USD
      E2E_SYMBOLS: BTC/USD,EUR/USD,GBP/USD,XAU/USD
      E2E_START: ${{ inputs.e2e_start || '' }}
      E2E_END: ${{ inputs.e2e_end || '' }}
      TCA_START: ${{ inputs.tca_start || '' }}
      TCA_END: ${{ inputs.tca_end || '' }}
      TCA_HORIZON_MINUTES: '60'
      TCA_OBSERVATION_SECONDS: '15'
      TCA_MAX_SETUPS: '200'
      TCA_MIN_TICKS: '1'
      TCA_STRATEGY_FILTERING: 'false'
      TCA_DATA_OWNER_ONLY: 'true'
      TCA_MAX_VAULT_EXPORTS: '4'
      TCA_REST_MIN_INTERVAL_SECONDS: '3'
      TCA_CALIBRATION_MIN_OBSERVATIONS: '100'
      NEWS_RSS_URLS: ${{ secrets.NEWS_RSS_URLS }}
      PYTHONUNBUFFERED: '1'
      LSE_REQUEST_MIN_INTERVAL_SECONDS: ${{ inputs.lse_request_min_interval || '1.20' }}
      LSE_429_COOLDOWN_SECONDS: ${{ inputs.lse_429_cooldown || '12' }}
      LSE_429_MAX_COOLDOWN_SECONDS: '60'
      FAST_WATCH_MIN_SCORE: '45'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Download empirical execution calibration
      uses: actions/download-artifact@v4
      with:
        name: historical-tick-replay-tca
        path: .
      if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_tca == true || inputs.run_e2e == true) }}
    - name: Set up Python 3.12 (Node 24 actions)
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: 'set -euo pipefail

        python -m pip install --upgrade pip

        python -m pip install "lse-data[frames]==0.14.0" "feedparser>=6.0,<7" "PyYAML>=6.0,<7" "matplotlib>=3.8,<4" "pandas>=2.0,<3" "pyarrow>=15,<23"

        python - <<''PY''

        from lse import LSE

        print("LSE client import: PASS")

        PY

        '
    - name: Download canonical replay scanner module
      uses: actions/download-artifact@v4
      with:
        name: replay-scanner
