me.fromtimestamp(float(v), tz=timezone.utc)\n    s = str(v).strip()\n    if s.isdigit() or (s.startswith(\"-\") and s[1:].isdigit()):\n        return datetime.fromtimestamp(float(s), tz=timezone.utc)\n    if s.endswith(\"Z\"):\n        s = s[:-1] + \"+00:00\"\n    dt = datetime.fromisoformat(s)\n    return dt if dt.tzinfo else dt.replace(tzinfo=timezone.utc)\ndef clean_num(v, default=0.0):\n    try:\n        x = float(v)\n        return x if math.isfinite(x) else default\n    except Exception:\n        return default\ndef normalize_rows(raw):\n    if isinstance(raw, dict):\n        for key in (\"data\", \"rows\", \"candles\", \"results\"):\n            if isinstance(raw.get(key), list):\n                raw = raw[key]\n                break\n    if not isinstance(raw, list):\n        return []\n    out = []\n    for r in raw:\n        if not isinstance(r, dict):\n            continue\n        ts = r.get(\"timestamp\", r.get(\"time\", r.get(\"datetime\")))\n        if ts is None:\n            continue\n        try:\n            dt = parse_ts(ts)\n        except Exception:\n            continue\n        c = {\n            \"timestamp\": dt,\n            \"open\": clean_num(r.get(\"open\")),\n            \"high\": clean_num(r.get(\"high\")),\n            \"low\": clean_num(r.get(\"low\")),\n            \"close\": clean_num(r.get(\"close\")),\n            \"volume\": clean_num(r.get(\"volume\", 0.0)),\n        }\n        if c[\"high\"] < max(c[\"open\"], c[\"close\"]) or c[\"low\"] > min(c[\"open\"], c[\"close\"]):\n            continue\n        if c[\"high\"] < c[\"low\"]:\n            continue\n        out.append(c)\n    out.sort(key=lambda x: x[\"timestamp\"])\n    return out\ndef timeframe_minutes(tf):\n    return {\"5m\": 5, \"15m\": 15, \"1h\": 60, \"4h\": 240, \"1d\": 1440}[tf]\ndef remove_incomplete(rows, tf):\n    if not rows:\n        return []\n    cutoff = now_utc()\n    if tf == \"1mo\":\n        return [\n            r for r in rows\n            if not (r[