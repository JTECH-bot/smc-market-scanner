        if-no-files-found: error
    if: ${{ always() && needs.validate_workflow.result == 'success' }}
on:
  workflow_dispatch:
    inputs:
      max_instruments:
        description: Fixed four-symbol study; this input cannot reduce the required BTC/USD, EUR/USD, GBP/USD, XAU/USD universe
        required: false
        default: '0'
        type: string
      categories:
        description: Informational catalog categories; fixed study symbols are always evaluated regardless of this filter
        required: false
        default: forex,commodity,crypto
        type: string
      top_n:
        description: Number of qualified setups / WAIT candidates to display
        required: false
        default: '5'
        type: string
      runtime_minutes:
        description: Maximum scanner runtime in minutes; 0 uses the safe default
        required: false
        default: '4'
        type: string
      scan_mode:
        description: ONCE = one complete scan; UNTIL_POSITION = repeat full scans until a confirmed position is found or the safety limit is reached
        required: false
        default: ONCE
        type: choice
        options:
        - ONCE
        - UNTIL_POSITION
      until_position_max_minutes:
        description: Safety limit for UNTIL_POSITION mode (maximum 55 minutes)
        required: false
        default: '55'
        type: string
      fast_candidate_limit:
        description: Maximum instruments promoted from the fast 1H/15M/5M filter to deep analysis
        required: false
        default: '8'
        type: string
      fast_min_score:
        description: Minimum fast-filter opportunity score to promote an instrument; lower values show more potential setups without changing confirmed-entry gates
        required: false
        default: '50'
        type: string
      lse_request_min_interval:
        description: Global minimum interval between interactive LSE candle requests; conservative default prevents plan-level 429 cascades
        required: false
        default: '1.20'
        type: string
      lse_429_cooldown:
        description: Initial cooldown after an LSE HTTP 429
        required: false
        default: '12'
        type: string
  schedule:
  - cron: 5,20,35,50 * * * *
