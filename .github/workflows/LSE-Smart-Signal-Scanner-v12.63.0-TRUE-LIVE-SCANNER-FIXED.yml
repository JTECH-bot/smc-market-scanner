name: LSE Smart Signal Scanner v12.61.0 — SCANNER ONLY — 5M SIGNAL BASE
permissions:
  contents: read
concurrency:
  group: lse-smart-scanner-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'LIVE' || inputs.scan_mode || 'ONCE' }}
  cancel-in-progress: true
jobs:
  validate_workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Validate scanner-only workflow and embedded Python
      run: "set -euo pipefail\npython -m pip install --disable-pip-version-check \"PyYAML>=6.0,<7\"\npython - <<'PY'\nimport ast\nimport re\nfrom pathlib import Path\nimport yaml\nclass Loader(yaml.SafeLoader):\n    pass\ndef mapping(loader, node, deep=False):\n    out = {}\n    for k, v in node.value:\n        key = loader.construct_object(k, deep=deep)\n        if key in out:\n            raise ValueError(f\"Duplicate YAML key {key!r} at line {k.start_mark.line + 1}\")\n        out[key] = loader.construct_object(v, deep=deep)\n    return out\nLoader.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, mapping)\ncandidates = sorted(Path(\".github/workflows\").glob(\"*.yml\")) + sorted(Path(\".github/workflows\").glob(\"*.yaml\"))\nmatches = [p for p in candidates if \"LSE Smart Signal Scanner\" in p.read_text(encoding=\"utf-8\") and \"from lse import LSE\" in p.read_text(encoding=\"utf-8\")]\nif len(matches) != 1:\n    raise SystemExit(f\"Expected exactly one LSE scanner workflow,\
        \ found {len(matches)}\")\npath = matches[0]\ntext = path.read_text(encoding=\"utf-8\")\ndoc = yaml.load(text, Loader=Loader)\njobs = doc.get(\"jobs\", {})\nassert set(jobs) == {\"validate_workflow\", \"scan\"}, f\"Unexpected jobs: {sorted(jobs)}\"\nassert jobs[\"scan\"].get(\"needs\") == [\"validate_workflow\"]\nenv_keys=set(jobs[\"scan\"].get(\"env\", {}))\nassert not any(k.startswith(\"RUN_\") for k in env_keys)\nscan_runs = \"\\n\".join(str(x.get(\"run\", \"\")) for x in jobs[\"scan\"].get(\"steps\", []) if isinstance(x.get(\"run\"), str))\nblocks = re.findall(r\"python - <<'PY'\\n(.*?)\\nPY\", scan_runs, flags=re.S)\nassert blocks, \"No embedded scanner Python block found\"\nfor i, b in enumerate(blocks, 1):\n    ast.parse(b, filename=f\"scanner_block_{i}.py\")\nprint(\"Scanner-only validation: PASS | live LSE only | 1MO/1D/4H/1H/15M/5M | scanner job only\")\nPY\n"
  scan:
    needs:
    - validate_workflow
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 70
    env:
      LSE_API_KEY: ${{ secrets.LSE_API_KEY }}
      MAX_INSTRUMENTS: ${{ inputs.max_instruments || '0' }}
      SCAN_RUNTIME_MINUTES: ${{ inputs.runtime_minutes || '8' }}
      LSE_CATEGORIES: ${{ inputs.categories || 'forex,commodity,crypto' }}
      TOP_N: ${{ inputs.top_n || '5' }}
      SCAN_MODE: ${{ inputs.scan_mode || 'ONCE' }}
      UNTIL_POSITION_MAX_MINUTES: ${{ inputs.until_position_max_minutes || '55' }}
      POLL_SECONDS: '30'
      FAST_CANDIDATE_LIMIT: ${{ inputs.fast_candidate_limit || '28' }}
      FAST_MIN_SCORE: ${{ inputs.fast_min_score || '50' }}
      NEWS_RSS_URLS: ${{ secrets.NEWS_RSS_URLS }}
      PYTHONUNBUFFERED: '1'
      LSE_REQUEST_MIN_INTERVAL_SECONDS: ${{ inputs.lse_request_min_interval || '1.20' }}
      LSE_429_COOLDOWN_SECONDS: ${{ inputs.lse_429_cooldown || '12' }}
      LSE_429_MAX_COOLDOWN_SECONDS: '60'
      FAST_WATCH_MIN_SCORE: '45'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Python 3.12 (Node 24 actions)
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: 'set -euo pipefail

        python -m pip install --upgrade pip

        python -m pip install "lse-data[frames]==0.14.0" "feedparser>=6.0,<7" "PyYAML>=6.0,<7" "matplotlib>=3.8,<4" "pandas>=2.0,<3" "pyarrow>=15,<23"

        python - <<''PY''

        from lse import LSE

        print("LSE client import: PASS")

        PY

        '
