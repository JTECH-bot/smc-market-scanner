        \    if python -c 'import json; d=json.load(open(\"scan_results.json\", encoding=\"utf-8\")); raise SystemExit(0 if any(str(x.get(\"status\",\"\")).startswith(\"CONFIRMED \") for x in d.get(\"entries\", [])) else 1)'; then\n      echo \"✅ CONFIRMED POSITION FOUND — stopping repeated scan cycles.\"\n      break\n    fi\n    if [ \"$(date +%s)\" -ge \"$deadline\" ]; then\n      echo \"⏱️ UNTIL_POSITION safety limit reached without a confirmed position.\"\n      break\n    fi\n    echo \"\U0001F7E1 No confirmed position yet. Waiting ${poll_seconds}s before the next full scan.\"\n    sleep \"$poll_seconds\"\n  done\nelse\n  scan_once\nfi\n"
    - name: Upload scanner results
