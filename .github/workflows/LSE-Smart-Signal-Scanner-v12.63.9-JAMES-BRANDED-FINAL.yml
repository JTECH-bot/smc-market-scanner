        EVENT_POSITIVE_WORDS = ("beat", "beats", "strong", "stronger", "above forecast", "above estimate", "hawkish", "rate hike", "hikes rates", "tightening", "growth", "surplus")
        EVENT_NEGATIVE_WORDS = ("miss", "misses", "weak", "weaker", "below forecast", "below estimate", "dovish", "rate cut", "cuts rates", "easing", "recession", "deficit")
        def _number(v):
            try:
                x = float(str(v).replace(",", "").replace("%", "").strip())
                return x if math.isfinite(x) else None
            except Exception:
                return None
        def _event_surprise(e):
            actual = next((_number(e.get(k)) for k in ("actual", "actual_value", "result", "value") if _number(e.get(k)) is not None), None)
            expected = next((_number(e.get(k)) for k in ("forecast", "consensus", "estimate", "expected") if _number(e.get(k)) is not None), None)
            return None if actual is None or expected is None else actual - expected
        def _event_dt(e):
            for k in ("timestamp", "datetime", "date", "time", "published_at"):
                if e.get(k):
                    try: return parse_ts(e[k])
                    except Exception: pass
            return None
        def _event_direction(e, symbol):
            canonical = SYMBOL_ALIASES.get(str(symbol).upper(), str(symbol))
            currencies = set(canonical.split("/")) if "/" in canonical else set()
            cur_text = " ".join(str(e.get(k, "")) for k in ("currency", "country", "region")).upper()
            cur = next((c for c in currencies if c in cur_text), None)
            if not cur:
                return "NEUTRAL"
            title = " ".join(str(e.get(k, "")) for k in ("title", "event", "name")).casefold()
            surprise = _event_surprise(e)
            lower_is_better = ("unemployment" in title or "jobless claims" in title or
                               "initial claims" in title or "continuing claims" in title)
            higher_is_better = ("retail sales" in title or "industrial production" in title or
                                "pmi" in title or "manufacturing" in title or "gdp" in title or
                                "employment" in title or "payroll" in title)
            hawkish = ("rate hike" in title or "hikes rates" in title or "tightening" in title or
                       "hawkish" in title or "higher for longer" in title)
            dovish = ("rate cut" in title or "cuts rates" in title or "easing" in title or
                      "dovish" in title)
            pos = any(w in title for w in EVENT_POSITIVE_WORDS)
            neg = any(w in title for w in EVENT_NEGATIVE_WORDS)
            if surprise is not None and abs(surprise) > 1e-12:
                surprise_positive = surprise < 0 if lower_is_better else True if higher_is_better else None
                if surprise_positive is not None:
                    pos, neg = surprise_positive, not surprise_positive
            if hawkish:
                pos, neg = True, False
            elif dovish:
                pos, neg = False, True
            if pos == neg:
                return "NEUTRAL"
            bias = "BUY" if pos else "SELL"
            base, quote = canonical.split("/", 1)
            return bias if cur == base else ("SELL" if bias == "BUY" else "BUY")
        def event_alignment(intel, symbol, side, price_rows_5m, price_rows_15m):
            """Event-aware gate: only immediate high-impact shock blocks; post-event reaction can qualify."""
            now = now_utc(); records = []
            canonical = SYMBOL_ALIASES.get(str(symbol).upper(), str(symbol))
            currencies = set(canonical.split("/")) if "/" in canonical else set()
            for e in intel.get("calendar", []):
