        def _pair_return(rows, lookback=24):
            closes = [float(r["close"]) for r in rows[-lookback:] if r.get("close") is not None]
            if len(closes) < 2 or closes[0] == 0:
                return None
            return (closes[-1] / closes[0]) - 1.0
        def build_currency_strength(pair_rows):
            """Relative major-currency strength from the same closed 1H bars used by the scanner."""
            scores = {c: [] for c in MAJOR_FX_CURRENCIES}
            for pair, rows in pair_rows.items():
                if "/" not in pair:
                    continue
                base, quote = pair.split("/", 1)
                if base not in scores or quote not in scores:
                    continue
                r = _pair_return(rows, 24)
                if r is None or not math.isfinite(r):
                    continue
                scores[base].append(r)
                scores[quote].append(-r)
            raw = {c: (statistics.fmean(v) if v else None) for c, v in scores.items()}
            valid = [v for v in raw.values() if v is not None]
            if not valid:
                return {"ranked": [], "scores": raw}
            lo, hi = min(valid), max(valid)
            ranked = []
            for c, v in raw.items():
                if v is None:
                    continue
                pct = 50.0 if hi == lo else 100.0 * (v - lo) / (hi - lo)
                ranked.append({"currency": c, "strength": round(v * 10000.0, 3), "score": round(pct, 1)})
            ranked.sort(key=lambda x: x["score"], reverse=True)
            return {"ranked": ranked, "scores": raw}
