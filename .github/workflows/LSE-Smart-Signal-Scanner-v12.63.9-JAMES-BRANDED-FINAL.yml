            SYMBOL_ALIASES.setdefault(_pair.replace("/", "-"), _pair)
            SYMBOL_ALIASES.setdefault(_pair.replace("/", "_"), _pair)
        def now_utc():
            return datetime.now(timezone.utc)
        def parse_ts(v):
            if isinstance(v, datetime):
                return v.astimezone(timezone.utc) if v.tzinfo else v.replace(tzinfo=timezone.utc)
            if isinstance(v, (int, float)) and math.isfinite(float(v)):
                return datetime.fromtimestamp(float(v), tz=timezone.utc)
            s = str(v).strip()
            if s.isdigit() or (s.startswith("-") and s[1:].isdigit()):
                return datetime.fromtimestamp(float(s), tz=timezone.utc)
            if s.endswith("Z"):
                s = s[:-1] + "+00:00"
            dt = datetime.fromisoformat(s)
            return dt if dt.tzinfo else dt.replace(tzinfo=timezone.utc)
        def clean_num(v, default=0.0):
            try:
                x = float(v)
                return x if math.isfinite(x) else default
            except Exception:
                return default
        def strict_ohlc_num(v):
            try:
                x = float(v)
                return x if math.isfinite(x) else None
            except (TypeError, ValueError, OverflowError):
                return None
        def normalize_rows(raw):
            if isinstance(raw, dict):
                for key in ("data", "rows", "candles", "results"):
                    if isinstance(raw.get(key), list):
                        raw = raw[key]
                        break
            if not isinstance(raw, list):
                return []
            out = []
            for r in raw:
                if not isinstance(r, dict):
                    continue
                ts = r.get("timestamp", r.get("time", r.get("datetime")))
                if ts is None:
                    continue
                try:
                    dt = parse_ts(ts)
                except Exception:
                    continue
                o = strict_ohlc_num(r.get("open"))
                h = strict_ohlc_num(r.get("high"))
                l = strict_ohlc_num(r.get("low"))
                c = strict_ohlc_num(r.get("close"))
                if None in (o, h, l, c):
                    continue
                if h < max(o, c) or l > min(o, c) or h < l:
                    continue
                out.append({"timestamp":dt,"open":o,"high":h,"low":l,"close":c,"volume":clean_num(r.get("volume",0.0))})
            out.sort(key=lambda x: x["timestamp"])
            return out
        def timeframe_minutes(tf):
            return {"5m": 5, "15m": 15, "1h": 60, "4h": 240, "1d": 1440}[tf]
        def remove_incomplete(rows, tf):
            if not rows:
                return []
            cutoff = now_utc()
            if tf == "1mo":
                return [
                    r for r in rows
                    if not (r["timestamp"].year == cutoff.year and r["timestamp"].month == cutoff.month)
                ]
            mins = timeframe_minutes(tf)
            return [
                r for r in rows
                if r["timestamp"] + timedelta(minutes=mins) <= cutoff
            ]
        def _candle_request(client, symbol, tf, limit):
            """v12.53.2 LSE SDK-aligned adaptive REST governor with per-run response caching.
            429s are quota evidence, not transient network errors. We do not
            retry them. Identical candle reads are served from the in-memory
            cache so the same API-key allowance is not spent twice in one run.
            """
            global LAST_API_REQUEST_AT, LAST_API_429_AT, API_429_STREAK
            global API_REQUEST_COUNT, API_RATE_LIMITED_COUNT, API_MIN_INTERVAL_SECONDS, API_QUOTA_BLOCKED
            cache_key = (str(symbol).upper(), str(tf), int(limit))
            if cache_key in CANDLE_RESPONSE_CACHE:
                return CANDLE_RESPONSE_CACHE[cache_key]
            if API_QUOTA_BLOCKED:
                return []
            last = None
            for attempt in range(API_MAX_RETRIES + 1):
                elapsed = time.monotonic() - LAST_API_REQUEST_AT
                wait_for = API_MIN_INTERVAL_SECONDS - elapsed
                if wait_for > 0:
                    time.sleep(wait_for)
                if LAST_API_429_AT:
                    cooldown = min(API_429_MAX_COOLDOWN_SECONDS,
                                   API_429_COOLDOWN_SECONDS * (2 ** max(0, API_429_STREAK - 1)))
                    since_429 = time.monotonic() - LAST_API_429_AT
                    if since_429 < cooldown:
                        time.sleep(cooldown - since_429)
                try:
                    result = client.candles(symbol, tf, limit=int(limit), order="desc")
                    LAST_API_REQUEST_AT = time.monotonic()
                    API_REQUEST_COUNT += 1
                    if API_429_STREAK > 0:
                        API_429_STREAK = max(0, API_429_STREAK - 1)
                    CANDLE_RESPONSE_CACHE[cache_key] = result
                    return result
                except Exception as exc:
                    last = exc
                    LAST_API_REQUEST_AT = time.monotonic()
                    msg = str(exc).lower()
                    is_429 = int(getattr(exc, "status", 0) or 0) == 429
                    is_429 = is_429 or "429" in msg or "rate limit" in msg or "too many requests" in msg
                    if is_429:
                        API_RATE_LIMITED_COUNT += 1
                        API_429_STREAK += 1
                        LAST_API_429_AT = time.monotonic()
                        API_QUOTA_BLOCKED = True
                        print(f"  ⚠️ LSE 429 {symbol} {tf}: provider quota/rate limit detected; GLOBAL CANDLE QUOTA CIRCUIT BREAKER engaged — no further candle REST requests will be issued in this run.")
                        return []
                    transient = ("503" in msg or "502" in msg or "504" in msg or
                                 "timeout" in msg or "timed out" in msg or "saturated" in msg)
                    if not transient or attempt == API_MAX_RETRIES:
                        raise
                    delay = API_RETRY_BASE_SECONDS * (2 ** attempt)
                    print(f"  LSE transient {type(exc).__name__} {symbol} {tf}; retry {attempt+1}/{API_MAX_RETRIES} in {delay:.1f}s")
                    time.sleep(delay)
            raise last
        def fetch_candles(client, symbol, tf, limit=None):
            use_limit = int(limit or FETCH_LIMIT[tf])
            raw = _candle_request(client, symbol, tf, use_limit)
            rows = remove_incomplete(normalize_rows(raw), tf)
            return rows[-use_limit:]
        def fetch_candles_with_forming(client, symbol, tf, limit=None):
            use_limit = int(limit or FETCH_LIMIT[tf])
            raw = _candle_request(client, symbol, tf, use_limit)
            normalized = normalize_rows(raw)
            closed = remove_incomplete(normalized, tf)
            forming = None
            if tf in ("1h", "15m", "5m"):  # HTF never exposes a forming candle
                cutoff = now_utc()
                incomplete_rows = [r for r in normalized if r["timestamp"] + timedelta(minutes=timeframe_minutes(tf)) > cutoff]
                if incomplete_rows:
                    forming = incomplete_rows[-1]
            return closed[-use_limit:], forming
        def closed_breakout_level(closed_rows, side):
            """Structural breakout level derived exclusively from CLOSED candles."""
            if not closed_rows or side not in ("BUY", "SELL"):
                return None
            last = closed_rows[-1]
            try:
                last_high = float(last["high"])
                last_low = float(last["low"])
            except (TypeError, ValueError, KeyError):
                return None
            sample = closed_rows[-TRIGGER_SWING_WINDOW:]
            highs, lows = swings(sample, TRIGGER_SWING_LOOKBACK)
            if side == "BUY":
                return float(highs[-1][1]) if highs else last_high
            return float(lows[-1][1]) if lows else last_low
        def _tick_value(tick, key, default=None):
            if isinstance(tick, dict):
                for k, v in tick.items():
                    if str(k).strip().lower() == str(key).strip().lower():
                        return v
                for nested_name in ("fields", "data", "quote"):
                    nested = tick.get(nested_name)
                    if isinstance(nested, dict):
                        for k, v in nested.items():
                            if str(k).strip().lower() == str(key).strip().lower():
                                return v
                return default
            try:
                return getattr(tick, key, default)
            except Exception:
                return default
        def collect_live_quotes(client, symbols, timeout=None):
            """Collect a short, bounded LSE websocket snapshot for execution modelling.
            The stream is intentionally separated from candle analysis. No tick can
            alter the single-engine directional score; ticks only determine whether a
            pre-existing closed-candle trigger is actually executable now.
            """
            timeout = 4.0 if timeout is None else timeout
            try:
                timeout = max(0.5, min(30.0, float(timeout)))
            except (TypeError, ValueError, OverflowError):
                timeout = 4.0
            symbols = [str(x) for x in symbols if str(x).strip()]
            if not symbols:
                return {}
            buckets = defaultdict(lambda: deque(maxlen=60))
            lock = threading.Lock()
            def on_tick(tick):
                raw_symbol = _tick_value(tick, "symbol")
                if not raw_symbol:
                    return
                symbol = SYMBOL_ALIASES.get(str(raw_symbol).strip().upper(), str(raw_symbol).strip())
                try:
                    bid = float(_tick_value(tick, "bid", 0) or 0)
                    ask = float(_tick_value(tick, "ask", 0) or 0)
                    price = float(_tick_value(tick, "price", 0) or 0)
                    volume = float(_tick_value(tick, "volume", 0) or 0)
                    ts_raw = _tick_value(tick, "timestamp")
                    if ts_raw is None:
                        ts = now_utc()
                    else:
                        ts = parse_ts(ts_raw)
                    if bid <= 0 or ask <= 0 or ask < bid:
                        return
                    with lock:
                        buckets[str(symbol)].append({
                            "timestamp": ts, "bid": bid, "ask": ask,
                            "price": price, "volume": volume
                        })
                except (TypeError, ValueError, OverflowError):
                    return
            stream_client = LSE(api_key=api_key)
            stream_client.on("tick", on_tick)
            worker_error = []
            def run_stream():
                try:
                    stream_client.connect(symbols=symbols)
                except TypeError:
                    try:
                        stream_client.connect(symbols)
                    except Exception as exc:
                        worker_error.append(exc)
                except Exception as exc:
                    worker_error.append(exc)
            thread = threading.Thread(target=run_stream, daemon=True)
            thread.start()
            time.sleep(max(0.5, float(timeout)))
            try:
                stream_client.disconnect()
            except Exception:
                pass
            thread.join(timeout=2.0)
            if worker_error:
                print(f"LIVE QUOTE STREAM WARNING: {type(worker_error[0]).__name__}: {worker_error[0]}")
            with lock:
                return {symbol: list(rows) for symbol, rows in buckets.items()}
        def execution_market_model(ticks, side, trigger_price, atr_value, symbol=None):
            """Top-of-book execution gate using real LSE bid/ask ticks.
            BUY execution uses ASK; SELL execution uses BID. Mid/last price is never
            substituted for the executable side. This is deliberately a top-of-book
            model, not a full depth/queue/market-impact model.
            """
            base = {
                "state":"NO_LIVE_QUOTE", "executable_price":None, "bid":None, "ask":None,
                "mid":None, "spread":None, "spread_atr":None, "spread_bps":None,
                "quote_age_seconds":None, "tick_count":0, "median_spread":None,
                "spread_vs_median":None, "micro_move_atr_per_tick":None,
                "trigger_crossed":False, "chase_distance_atr":None,
                "execution_score":0.0, "slippage_proxy_atr":None,
                "arrival_mid":None, "implementation_shortfall_bps":None,
                "adverse_move_bps":None, "spread_cost_bps":None,
                "observation_seconds":0.0,
                "reason":"no valid bid/ask ticks"
            }
            env = asset_environment(symbol or "")
            max_quote_age = float(env.get("quote_max_age", MAX_QUOTE_AGE_SECONDS))
            max_spread_atr = float(env.get("max_spread_atr", MAX_SPREAD_ATR))
            max_spread_median = float(env.get("max_spread_median", MAX_SPREAD_MEDIAN_MULTIPLIER))
            micro_move_max = float(env.get("micro_move_max_atr", EXECUTION_STABILITY_MAX_ATR_PER_TICK))
            min_tick_samples = int(env.get("min_tick_samples", LIVE_TICK_MIN_SAMPLES))
            if side not in ("BUY","SELL") or trigger_price is None or not atr_value or atr_value <= 0:
                return base
            valid = []
            for t in ticks or []:
                try:
                    bid, ask = float(t["bid"]), float(t["ask"])
                    ts = t["timestamp"]
                    if bid > 0 and ask >= bid and ask > 0:
                        valid.append((ts, bid, ask))
                except (KeyError, TypeError, ValueError):
                    continue
            if not valid:
                return base
            valid.sort(key=lambda x:x[0])
            ts, bid, ask = valid[-1]
            age = max(0.0, (now_utc() - ts).total_seconds())
            mid_series = [(b+a)/2.0 for _, b, a in valid]
            spreads = [a-b for _, b, a in valid]
            arrival_mid = mid_series[0]
            observation_seconds = max(0.0, (valid[-1][0] - valid[0][0]).total_seconds())
            spread = ask-bid
            median_spread = statistics.median(spreads) if spreads else spread
            mid = (bid+ask)/2.0
            executable = ask if side == "BUY" else bid
            crossed = executable >= float(trigger_price) if side == "BUY" else executable <= float(trigger_price)
            implementation_shortfall_bps = (
                ((executable-arrival_mid)/max(arrival_mid,1e-12))*10000.0
                if side == "BUY" else
                ((arrival_mid-executable)/max(arrival_mid,1e-12))*10000.0
            )
            adverse_move_bps = (
                ((mid-arrival_mid)/max(arrival_mid,1e-12))*10000.0
                if side == "BUY" else
                ((arrival_mid-mid)/max(arrival_mid,1e-12))*10000.0
            )
            spread_cost_bps = (spread/max(mid,1e-12))*5000.0
            chase = abs(executable-float(trigger_price))/atr_value
            spread_atr = spread/atr_value
            spread_bps = (spread/max(mid,1e-12))*10000.0
            spread_vs_median = spread/max(median_spread,1e-12)
            micro_moves = [abs(mid_series[i]-mid_series[i-1])/atr_value for i in range(1,len(mid_series))]
            micro_move = statistics.median(micro_moves) if micro_moves else 0.0
            score = 100.0
            reasons = []
            if age > max_quote_age:
                score -= 45.0; reasons.append(f"quote stale by {age:.2f}s")
            if spread_atr > max_spread_atr:
                score -= 25.0; reasons.append(f"spread is {spread_atr:.2f} ATR")
            if spread_vs_median > max_spread_median:
                score -= 20.0; reasons.append(f"spread is {spread_vs_median:.1f}x snapshot median")
            if micro_move > micro_move_max:
                score -= 20.0; reasons.append(f"micro-price movement {micro_move:.2f} ATR/tick is unstable")
            if chase > ENTRY_MAX_CHASE_ATR:
                score -= 30.0; reasons.append(f"execution price is {chase:.2f} ATR beyond trigger")
            if implementation_shortfall_bps > max(2.0, spread_bps * 1.5):
                score -= 10.0; reasons.append(f"estimated implementation shortfall {implementation_shortfall_bps:.2f} bps is elevated")
            if len(valid) < min_tick_samples:
                score -= 15.0; reasons.append(f"only {len(valid)} valid quote samples for {env.get('name')}")
            score = max(0.0, min(100.0, score))
            if age > max_quote_age:
                state = "STALE_QUOTE"
            elif spread_atr > max_spread_atr or spread_vs_median > max_spread_median:
                state = "WIDE_SPREAD"
            elif micro_move > micro_move_max:
                state = "MICROSTRUCTURE_UNSTABLE"
            elif crossed and chase > ENTRY_MAX_CHASE_ATR:
                state = "OVEREXTENDED"
            elif crossed:
                state = "EXECUTABLE_TRIGGER_CROSSED"
            else:
                state = "WAITING_FOR_TRIGGER"
            slippage_proxy = (spread/2.0)/atr_value + max(0.0, micro_move)
            reason = "; ".join(reasons) if reasons else (
                "fresh executable quote; trigger not crossed" if not crossed else
                "fresh executable quote crossed the closed-candle trigger"
            )
            return {
                "state":state, "executable_price":executable, "bid":bid, "ask":ask, "mid":mid,
                "spread":spread, "spread_atr":spread_atr, "spread_bps":spread_bps,
                "quote_age_seconds":age, "tick_count":len(valid), "median_spread":median_spread,
                "spread_vs_median":spread_vs_median, "micro_move_atr_per_tick":micro_move,
                "trigger_crossed":crossed, "chase_distance_atr":chase,
                "execution_score":round(score,1), "slippage_proxy_atr":slippage_proxy,
                "arrival_mid":arrival_mid, "implementation_shortfall_bps":implementation_shortfall_bps,
                "adverse_move_bps":adverse_move_bps, "spread_cost_bps":spread_cost_bps,
                "observation_seconds":observation_seconds,
                "reason":reason
            }
        def price_feed_consistent(closed_rows, live_ticks):
            """Reject obvious scale/symbol mismatches between candles and live quotes."""
            if not closed_rows or not live_ticks:
                return True, None
            try:
                close = float(closed_rows[-1]["close"])
                valid = [t for t in live_ticks if t.get("bid") and t.get("ask")]
                if close <= 0 or not valid:
                    return True, None
                mid = (float(valid[-1]["bid"]) + float(valid[-1]["ask"])) / 2.0
                a = atr(closed_rows) or 0.0
                if mid <= 0:
                    return False, "live quote midpoint is non-positive"
                relative_gap = abs(close - mid) / mid
                max_gap = min(0.25, max(0.02, 15.0 * a / close)) if a > 0 else 0.05
                if relative_gap > max_gap:
                    return False, f"candle/live price mismatch {relative_gap*100:.1f}% > allowed {max_gap*100:.1f}%"
                return True, None
            except (TypeError, ValueError, KeyError, ZeroDivisionError):
                return False, "unable to validate candle/live price scale"
        def execution_trigger_state(closed_rows, live_quote=None, side=None, symbol=None):
            """Closed-candle trigger + real executable bid/ask validation."""
            if not closed_rows or side not in ("BUY","SELL"):
                return {"state":"UNAVAILABLE","signal":"NEUTRAL","trigger_price":None,
                        "current_price":None,"reason":"closed execution history unavailable"}
            av = atr(closed_rows) or 0.0
            if av <= 0:
                return {"state":"UNAVAILABLE","signal":"NEUTRAL","trigger_price":None,
                        "current_price":None,"reason":"ATR unavailable"}
            reference = closed_breakout_level(closed_rows, side)
            if reference is None:
                return {"state":"UNAVAILABLE","signal":"NEUTRAL","trigger_price":None,
                        "current_price":None,"reason":"closed structural trigger unavailable"}
            env = asset_environment(symbol or "")
            try:
                entry_buffer_atr = float(env.get("entry_buffer_atr", ENTRY_BUFFER_ATR))
            except (TypeError, ValueError, OverflowError):
                entry_buffer_atr = ENTRY_BUFFER_ATR
            if not math.isfinite(entry_buffer_atr) or entry_buffer_atr < 0:
                entry_buffer_atr = ENTRY_BUFFER_ATR
            trigger = float(reference + av * entry_buffer_atr) if side == "BUY" else float(reference - av * entry_buffer_atr)
            model = execution_market_model((live_quote or {}).get("ticks", []), side, trigger, av, symbol=symbol)
            model.update({
                "trigger_price":trigger,
                "reference_candle_timestamp":str(closed_rows[-1].get("timestamp")),
                "signal": side if model.get("state") == "EXECUTABLE_TRIGGER_CROSSED" and model.get("execution_score",0) >= EXECUTION_SCORE_MIN else "NEUTRAL",
                "current_price":model.get("executable_price"),
            })
            return model
        def closed_candle_bias(rows):
            """Directional candle evidence from the last CLOSED candle only."""
            return candle_signal(rows)
        def ema(values, period):
            if len(values) < period:
                return [None] * len(values)
            alpha = 2.0 / (period + 1)
            out = [None] * (period - 1)
            e = statistics.fmean(values[:period])
            out.append(e)
            for v in values[period:]:
                e = alpha * v + (1 - alpha) * e
                out.append(e)
            return out
        def rsi(values, period=14):
            if len(values) <= period:
                return None
            gains, losses = [], []
            for i in range(1, len(values)):
                d = values[i] - values[i - 1]
                gains.append(max(d, 0))
                losses.append(max(-d, 0))
            ag = statistics.fmean(gains[:period])
            al = statistics.fmean(losses[:period])
            for g, l in zip(gains[period:], losses[period:]):
                ag = (ag * (period - 1) + g) / period
                al = (al * (period - 1) + l) / period
            if al == 0:
                return 100.0
            return 100.0 - (100.0 / (1.0 + ag / al))
        def atr(rows, period=14):
            if len(rows) <= period:
                return None
            trs = []
            for i in range(1, len(rows)):
                h, l, pc = rows[i]["high"], rows[i]["low"], rows[i-1]["close"]
                trs.append(max(h-l, abs(h-pc), abs(l-pc)))
            return statistics.fmean(trs[-period:])
        def macd(values):
            e12, e26 = ema(values, 12), ema(values, 26)
            series = [(a-b) for a, b in zip(e12, e26) if a is not None and b is not None]
            if len(series) < 9:
                return 0.0, 0.0
            sig = ema(series, 9)
            return series[-1], sig[-1] if sig[-1] is not None else 0.0
        def swings(rows, lookback=2):
            highs, lows = [], []
            for i in range(lookback, len(rows)-lookback):
                h = rows[i]["high"]
                l = rows[i]["low"]
                if h == max(x["high"] for x in rows[i-lookback:i+lookback+1]):
                    highs.append((i, h))
                if l == min(x["low"] for x in rows[i-lookback:i+lookback+1]):
                    lows.append((i, l))
            return highs, lows
        def direction(rows):
            if len(rows) < 30:
                return "NEUTRAL"
            c = [x["close"] for x in rows]
            e20, e50 = ema(c, 20), ema(c, 50)
            if e20[-1] is None or e50[-1] is None:
                return "NEUTRAL"
            if c[-1] > e20[-1] > e50[-1]:
                return "BUY"
            if c[-1] < e20[-1] < e50[-1]:
                return "SELL"
            return "NEUTRAL"
        def structure_signal(rows):
            if len(rows) < 20:
                return "NEUTRAL", "insufficient structure"
            highs, lows = swings(rows[-80:], 2)
            if len(highs) < 2 or len(lows) < 2:
                return "NEUTRAL", "insufficient swing structure"
            last_h, prev_h = highs[-1][1], highs[-2][1]
            last_l, prev_l = lows[-1][1], lows[-2][1]
            if last_h > prev_h and last_l > prev_l:
                return "BUY", "bullish HH + HL"
            if last_h < prev_h and last_l < prev_l:
                return "SELL", "bearish LH + LL"
            return "NEUTRAL", "mixed structure"
        def candle_signal(rows):
            if len(rows) < 3:
                return "NEUTRAL", "insufficient candles"
            a, b = rows[-2], rows[-1]
            body = abs(b["close"] - b["open"])
            rng = max(b["high"] - b["low"], 1e-12)
            bull = b["close"] > b["open"]
            bear = b["close"] < b["open"]
            engulf_bull = bull and a["close"] < a["open"] and b["close"] >= a["open"] and b["open"] <= a["close"]
            engulf_bear = bear and a["close"] > a["open"] and b["open"] >= a["close"] and b["close"] <= a["open"]
            if engulf_bull or (bull and body/rng >= 0.65):
                return "BUY", "bullish impulse/engulfing"
            if engulf_bear or (bear and body/rng >= 0.65):
                return "SELL", "bearish impulse/engulfing"
            return "NEUTRAL", "no strong price action"
        def liquidity_signal(rows):
            if len(rows) < 25:
                return "NEUTRAL", "insufficient liquidity history"
            prior = rows[-21:-1]
            last = rows[-1]
            hi = max(x["high"] for x in prior)
            lo = min(x["low"] for x in prior)
            if last["low"] < lo and last["close"] > lo:
                return "BUY", "sell-side liquidity sweep"
            if last["high"] > hi and last["close"] < hi:
                return "SELL", "buy-side liquidity sweep"
            return "NEUTRAL", "no fresh sweep"
        def fib_signal(rows):
            if len(rows) < 40:
                return "NEUTRAL", "insufficient swing range"
            highs, lows = swings(rows[-100:], 2)
            if not highs or not lows:
                return "NEUTRAL", "no usable swing"
            h = highs[-1][1]
            l = lows[-1][1]
            span = h - l
            if span <= 0:
                return "NEUTRAL", "invalid swing range"
            p = rows[-1]["close"]
            retr = (p-l)/span
            if 0.382 <= retr <= 0.618:
                d = direction(rows)
                return d, "price in 0.382-0.618 retracement zone" if d != "NEUTRAL" else "fib zone, trend unclear"
            return "NEUTRAL", "fib zone not near"
        def trend_signal(rows):
            d = direction(rows)
            return d, ("EMA alignment" if d != "NEUTRAL" else "mixed EMA alignment")
        def indicator_signal(rows):
            c = [x["close"] for x in rows]
            rv = rsi(c)
            m, s = macd(c)
            if rv is None:
                return "NEUTRAL", "RSI unavailable"
            if rv >= 55 and m > s:
                return "BUY", f"RSI {rv:.1f} / MACD bullish"
            if rv <= 45 and m < s:
                return "SELL", f"RSI {rv:.1f} / MACD bearish"
            return "NEUTRAL", f"RSI {rv:.1f} / MACD mixed"
        def session_signal(rows, category):
            if not rows:
                return "NEUTRAL", "session unavailable"
            h = rows[-1]["timestamp"].hour
            if str(category).lower() == "commodity":
                if 13 <= h < 17:
                    return direction(rows), "XAU London + New York prime overlap"
                if 7 <= h < 13:
                    return direction(rows), "XAU London liquidity window"
                if 17 <= h < 21:
                    return direction(rows), "XAU New York continuation"
                return "NEUTRAL", "XAU outside preferred liquidity window"
            if 13 <= h < 16:
                return direction(rows), "London + New York overlap"
            if 7 <= h < 16:
                return direction(rows), "London session"
            if 13 <= h < 21:
                return direction(rows), "New York session"
            return "NEUTRAL", "outside preferred session"
        
        def current_trading_session(now=None):
            """Current global FX session for reporting only; never changes strategy qualification."""
            now = now or now_utc()
            h = now.hour + now.minute / 60.0
            if 13 <= h < 16:
                name, quality = "LONDON + NEW YORK OVERLAP", "PRIME LIQUIDITY"
            elif 7 <= h < 13:
                name, quality = "LONDON", "ACTIVE"
            elif 16 <= h < 21:
                name, quality = "NEW YORK", "ACTIVE"
            elif 0 <= h < 7:
                name, quality = "ASIA/PACIFIC", "ACTIVE"
            else:
                name, quality = "TRANSITION / OFF-PRIME", "LOWER LIQUIDITY"
            eat = timezone(timedelta(hours=3))
            return {"name": name, "quality": quality, "utc": now.isoformat(), "eat": now.astimezone(eat).isoformat(), "source": "CURRENT_UTC_CLOCK"}
        def smc_signal(rows):
            if len(rows) < 30:
                return "NEUTRAL", "insufficient MSS history"
            last = rows[-1]
            hi = max(x["high"] for x in rows[-21:-1])
            lo = min(x["low"] for x in rows[-21:-1])
            if last["close"] > hi:
                return "BUY", "bullish MSS / structure break"
            if last["close"] < lo:
                return "SELL", "bearish MSS / structure break"
            return "NEUTRAL", "no confirmed MSS"
        def supply_demand_signal(rows):
            if len(rows) < 30:
                return "NEUTRAL", "insufficient impulse history"
            a, b = rows[-2], rows[-1]
            atrv = atr(rows)
            if atrv is None:
                return "NEUTRAL", "ATR unavailable"
            body = abs(b["close"] - b["open"])
            if body >= 1.2 * atrv:
                return ("BUY", "demand zone + bullish impulse") if b["close"] > b["open"] else ("SELL", "supply zone + bearish impulse")
            return "NEUTRAL", "no strong impulse"
        def fair_value_gaps(rows, lookback=80):
            """Detect real closed-candle three-candle imbalances."""
            if len(rows) < 3:
                return []
            sample = rows[-lookback:]
            out = []
            for i in range(2, len(sample)):
                a, b, c = sample[i-2], sample[i-1], sample[i]
                av = atr(sample[:i+1])
                if c["low"] > a["high"]:
                    gap = c["low"] - a["high"]
                    out.append({"side":"BUY","timestamp":c["timestamp"],"low":a["high"],"high":c["low"],"gap":gap,"quality":gap/av if av and av > 0 else 0.0,"mitigated":any(x["low"] <= a["high"] for x in sample[i+1:])})
                if c["high"] < a["low"]:
                    gap = a["low"] - c["high"]
                    out.append({"side":"SELL","timestamp":c["timestamp"],"low":c["high"],"high":a["low"],"gap":gap,"quality":gap/av if av and av > 0 else 0.0,"mitigated":any(x["high"] >= a["low"] for x in sample[i+1:])})
            return out
        def fvg_signal(rows):
            fresh = [g for g in fair_value_gaps(rows) if not g["mitigated"]]
            if not fresh:
                return "NEUTRAL", "no fresh unmitigated FVG", None
            g = fresh[-1]
            strength = "strong" if g["quality"] >= 0.25 else "normal"
            return g["side"], f"{strength} unmitigated FVG {g['low']:.6g}-{g['high']:.6g}", g
        def _rng(c): return max(float(c["high"])-float(c["low"]),1e-12)
        def _body(c): return abs(float(c["close"])-float(c["open"]))
        def _displacement(rows):
            if len(rows)<25: return False
            av=atr(rows)
            if not av: return False
            c=rows[-1]; med=statistics.median([_rng(x) for x in rows[-21:-1]])
            return _body(c)/_rng(c)>=0.55 and _rng(c)>=1.15*av and _rng(c)>=1.20*med
        def _rejection(rows,side):
            if not rows:return False
            c=rows[-1]; r=_rng(c); o,h,l,cl=map(float,(c["open"],c["high"],c["low"],c["close"]))
            return ((side=="BUY" and cl>o and (cl-l)/r>=.70 and (h-cl)/r<=.25) or
                    (side=="SELL" and cl<o and (h-cl)/r>=.70 and (cl-l)/r<=.25))
        def _range(rows,n=20):
            if len(rows)<n+1:return None
            s=rows[-n-1:-1]; return max(float(x["high"]) for x in s),min(float(x["low"]) for x in s)
        def _ema_pullback(rows):
            if len(rows)<60:return "NEUTRAL","insufficient EMA history"
            c=[]
            for x in rows:
                try:
                    v=float(x.get("close"))
                    if math.isfinite(v):
                        c.append(v)
                except (TypeError,ValueError,AttributeError):
                    continue
            if len(c)<60:return "NEUTRAL","insufficient valid EMA closes"
            e20_series,e50_series=ema(c,20),ema(c,50)
            try:
                av=atr(rows)
            except (TypeError,ValueError,KeyError):
                av=None
            if not av:return "NEUTRAL","EMA/ATR unavailable"
            e20=e20_series[-1] if isinstance(e20_series,list) else e20_series
            e50=e50_series[-1] if isinstance(e50_series,list) else e50_series
            if e20 is None or e50 is None:return "NEUTRAL","EMA values unavailable"
            p=c[-1]
            if e20>e50 and abs(p-e20)<=.45*av and p>=e50:return "BUY","EMA20/50 bullish pullback"
            if e20<e50 and abs(p-e20)<=.45*av and p<=e50:return "SELL","EMA20/50 bearish pullback"
            return "NEUTRAL","no EMA20/50 pullback"
        def _bollinger(rows):
            if len(rows)<25:return "NEUTRAL","insufficient Bollinger history"
            c=[float(x["close"]) for x in rows[-20:]]; mid=statistics.fmean(c); sd=statistics.pstdev(c)
            if sd<=0:return "NEUTRAL","zero Bollinger deviation"
            p=c[-1]
            if p<=mid-2*sd and p>c[-2]:return "BUY","lower-band rejection"
            if p>=mid+2*sd and p<c[-2]:return "SELL","upper-band rejection"
            return "NEUTRAL","no Bollinger reversal"
        def _stochastic(rows):
            if len(rows)<20:return "NEUTRAL","insufficient stochastic history"
            s=rows[-14:]; hi=max(float(x["high"]) for x in s); lo=min(float(x["low"]) for x in s)
            k=100*(float(s[-1]["close"])-lo)/max(hi-lo,1e-12); kp=100*(float(s[-2]["close"])-lo)/max(hi-lo,1e-12)
            if k<20 and k>kp:return "BUY",f"stochastic reversal {k:.1f}"
            if k>80 and k<kp:return "SELL",f"stochastic reversal {k:.1f}"
            return "NEUTRAL",f"stochastic {k:.1f}"
        def _vwap(rows):
            vols=[float(x.get("volume") or 0) for x in rows[-50:]]
            if sum(vols)<=0:return "NEUTRAL","VWAP unavailable: no usable volume"
            pv=sum((((float(x["high"])+float(x["low"])+float(x["close"]))/3)*float(x.get("volume") or 0)) for x in rows[-50:])
            vv=sum(vols); v=pv/vv; p=float(rows[-1]["close"]); av=atr(rows)
            if not av:return "NEUTRAL","ATR unavailable"
            if p<v and p>float(rows[-1]["open"]) and abs(p-v)<=av:return "BUY","VWAP reversion"
            if p>v and p<float(rows[-1]["open"]) and abs(p-v)<=av:return "SELL","VWAP reversion"
            return "NEUTRAL","no VWAP reversion"
        def _rsi_div(rows):
            if len(rows)<60:return "NEUTRAL","insufficient divergence history"
            c=[float(x["close"]) for x in rows]; rv=[rsi(c[:i+1]) for i in range(len(c))]
            hs,ls=swings(rows[-80:],2); off=max(0,len(rows)-80)
            if len(ls)>=2:
                a,b=ls[-2],ls[-1]; ia,ib=off+a[0],off+b[0]
                if all(0<=i<len(rv) and rv[i] is not None for i in (ia,ib)) and b[1]<a[1] and rv[ib]>rv[ia]+2:return "BUY","bullish RSI divergence"
            if len(hs)>=2:
                a,b=hs[-2],hs[-1]; ia,ib=off+a[0],off+b[0]
                if all(0<=i<len(rv) and rv[i] is not None for i in (ia,ib)) and b[1]>a[1] and rv[ib]<rv[ia]-2:return "SELL","bearish RSI divergence"
            return "NEUTRAL","no RSI divergence"
        def _break_retest(rows):
            rr=_range(rows)
            if not rr:return "NEUTRAL","insufficient range"
            hi,lo=rr;p=float(rows[-1]["close"]);av=atr(rows)
            if not av:return "NEUTRAL","ATR unavailable"
            if p>hi and abs(p-hi)<=.60*av:return "BUY","range breakout/retest"
            if p<lo and abs(p-lo)<=.60*av:return "SELL","range breakout/retest"
            return "NEUTRAL","no breakout/retest"
        def _range_reject(rows):
            rr=_range(rows)
            if not rr:return "NEUTRAL","insufficient range"
            hi,lo=rr;c=rows[-1]
            if float(c["low"])<=lo and float(c["close"])>lo and _rejection(rows,"BUY"):return "BUY","range-low rejection"
            if float(c["high"])>=hi and float(c["close"])<hi and _rejection(rows,"SELL"):return "SELL","range-high rejection"
            return "NEUTRAL","no range rejection"
        def _momentum(rows):
            if len(rows)<30:return "NEUTRAL","insufficient momentum history"
            av=atr(rows);c=rows[-1]
            if not av:return "NEUTRAL","ATR unavailable"
            if _rng(c)>=1.15*av and _body(c)/_rng(c)>=.65:
                return ("BUY","bullish momentum continuation") if float(c["close"])>float(c["open"]) else ("SELL","bearish momentum continuation")
            return "NEUTRAL","no qualifying momentum"
        def _session_breakout(rows):
            if len(rows)<30:return "NEUTRAL","insufficient session history"
            now=rows[-1]["timestamp"]
            if not 9<=now.hour<=17:return "NEUTRAL","outside session window"
            s=[x for x in rows[-120:] if x["timestamp"].date()==now.date() and 7<=x["timestamp"].hour<9]
            if len(s)<2:return "NEUTRAL","opening range unavailable"
            hi=max(float(x["high"]) for x in s);lo=min(float(x["low"]) for x in s);p=float(rows[-1]["close"])
            if p>hi:return "BUY","opening/session range breakout"
            if p<lo:return "SELL","opening/session range breakout"
            return "NEUTRAL","inside opening range"
        def _prevday(rows,daily,mode="sweep"):
            if len(daily)<3:return "NEUTRAL","previous-day level unavailable"
            hi,lo=float(daily[-2]["high"]),float(daily[-2]["low"]);c=rows[-1]
            if mode=="sweep":
                if float(c["high"])>hi and float(c["close"])<hi:return "SELL","previous-day-high sweep"
                if float(c["low"])<lo and float(c["close"])>lo:return "BUY","previous-day-low sweep"
            else:
                if float(c["close"])>hi:return "BUY","previous-day-high breakout"
                if float(c["close"])<lo:return "SELL","previous-day-low breakout"
            return "NEUTRAL","no previous-day event"
        def _asian(rows):
            if not rows:return "NEUTRAL","Asian range unavailable"
            now=rows[-1]["timestamp"];s=[x for x in rows[-180:] if x["timestamp"].date()==now.date() and 0<=x["timestamp"].hour<7]
            if len(s)<3:return "NEUTRAL","insufficient Asian range"
            hi=max(float(x["high"]) for x in s);lo=min(float(x["low"]) for x in s);c=rows[-1]
            if float(c["low"])<lo and float(c["close"])>lo:return "BUY","Asian-low sweep"
            if float(c["high"])>hi and float(c["close"])<hi:return "SELL","Asian-high sweep"
            return "NEUTRAL","no Asian sweep"
        def _order_block(rows):
            if len(rows)<15:return "NEUTRAL",None,"insufficient order-block history"
            av=atr(rows)
            if not av:return "NEUTRAL",None,"ATR unavailable"
            for i in range(len(rows)-2,max(-1,len(rows)-10),-1):
                b,imp=rows[i],rows[i+1]
                if _body(imp)<1.2*av:continue
                bull=float(imp["close"])>float(imp["open"]); bb=float(b["close"])<float(b["open"]); br=float(b["close"])>float(b["open"])
                p=float(rows[-1]["close"]);z=(float(b["low"]),float(b["high"]))
                if bull and bb and z[0]-.25*av<=p<=z[1]+.25*av:return "BUY",z,"bullish OB retest"
                if not bull and br and z[0]-.25*av<=p<=z[1]+.25*av:return "SELL",z,"bearish OB retest"
            return "NEUTRAL",None,"no fresh OB retest"
        def _breaker(rows):
            if len(rows)<25:return "NEUTRAL","insufficient breaker history"
            sig,z,_=_order_block(rows[:-3]);av=atr(rows)
            if sig=="NEUTRAL" or not z or not av:return "NEUTRAL","no breaker candidate"
            p=float(rows[-1]["close"])
            if sig=="SELL" and z[0]<p<=z[1]+.35*av:return "BUY","bullish breaker retest"
            if sig=="BUY" and z[0]-.35*av<=p<z[1]:return "SELL","bearish breaker retest"
            return "NEUTRAL","no breaker retest"
        def _near_fvg(rows,side):
            sig,_,g=fvg_signal(rows)
            if sig!=side or not g:return False
            av=atr(rows);p=float(rows[-1]["close"])
            return bool(av and g["low"]-.60*av<=p<=g["high"]+.60*av)
        def _srec(name,cat,tier,side,score,evidence):
            return {"name":name,"category":cat,"tier":tier,"side":side,"score":float(score),"evidence":evidence}
        def normalize_strategy_rows(rows):
            """Return only candles with finite OHLC values for strategy math; never coerce None to 0."""
            clean = []
            for r in rows or []:
                if not isinstance(r, dict):
                    continue
                try:
                    vals = {k: float(r.get(k)) for k in ("open","high","low","close")}
                    if not all(math.isfinite(v) for v in vals.values()):
                        continue
                    if vals["high"] < max(vals["open"], vals["close"]) or vals["low"] > min(vals["open"], vals["close"]) or vals["high"] < vals["low"]:
                        continue
                    x = dict(r)
                    x.update(vals)
                    clean.append(x)
                except (TypeError, ValueError):
                    continue
            return clean
        
        def nine_strategy_signals(rows, category="", smc_result=None):
            """Nine directional strategy modules. Neutral modules do not vote against a side.
            These are rule modules, not nine independent market data sources. Confirmation requires
            at least two distinct aligned strategy names plus the separate monthly/context/execution gates.
            """
            out=[]
            try:
                smc = smc_result if isinstance(smc_result, dict) else smc_core(rows)
                out.append({"name":"SMC","signal":smc.get("side") if smc.get("passed") else "NEUTRAL",
                            "why":smc.get("why","SMC not passed"),"score":float(smc.get("score",0) or 0),"category":"SMC"})
            except Exception as exc:
                out.append({"name":"SMC","signal":"NEUTRAL","why":f"error: {type(exc).__name__}","score":0.0,"category":"SMC"})
            funcs=[
                ("Market Structure", lambda x: structure_signal(x)),
                ("Liquidity", lambda x: liquidity_signal(x)),
                ("Supply/Demand", lambda x: supply_demand_signal(x)),
                ("Price Action", lambda x: candle_signal(x)),
                ("Fibonacci", lambda x: fib_signal(x)),
                ("Trend", lambda x: trend_signal(x)),
                ("RSI+MACD", lambda x: indicator_signal(x)),
                ("Session", lambda x: session_signal(x, category)),
            ]
            for name, fn in funcs:
                try:
                    sig, why = fn(rows)
                except Exception as exc:
                    sig, why = "NEUTRAL", f"error: {type(exc).__name__}"
                out.append({"name":name,"signal":sig if sig in ("BUY","SELL") else "NEUTRAL",
                            "why":why,"score":100.0 if sig in ("BUY","SELL") else 0.0,"category":name})
            return out
        
        def strategy_catalog(data,symbol,currency_strength):
            chain=("1mo","1d","4h","1h","15m","5m")
            results=[]
            for tf in chain:
                rows=data.get(tf,[])
                if len(rows)<30:
                    continue
                smc=None
                try: smc=smc_core(rows)
                except Exception: smc=None
                for item in nine_strategy_signals(rows, "", smc):
                    if item.get("signal") in ("BUY","SELL"):
                        results.append({
                            "name":item["name"],"category":item.get("category",item["name"]),
                            "tier":"A" if item.get("name") in ("SMC","Market Structure","Liquidity") else "B",
                            "side":item["signal"],"score":float(item.get("score",0) or 0),
                            "timeframe":tf,"evidence":[item.get("why","")]
                        })
            return results
        def strategy_summary(matches,side):
            m=[x for x in matches if x.get("side")==side]
            by_name={}
            for x in m:
                by_name.setdefault(x.get("name"),[]).append(x)
            names=sorted([n for n in by_name if n])
            tfs=sorted(set(x.get("timeframe") for x in m if x.get("timeframe")))
            best=max([float(x.get("score",0) or 0) for x in m],default=0.0)
            breadth=min(30.0,max(0.0,(len(names)-2)*8.0))
            tf_bonus=min(20.0,max(0.0,(len(tfs)-1)*5.0))
            score=min(100.0,45.0+len(names)*8.0+breadth+tf_bonus) if names else 0.0
            confirmed=len(names)>=MIN_CONFIRMED_STRATEGIES
            tier="A" if len(names)>=S_TIER_MIN_STRATEGIES and score>=85 else ("B" if confirmed else "C")
            return {"confirmed":confirmed,"count":len(names),"strategies":names,"categories":names,
                    "tier":tier,"score":round(score,1),"best":max(m,key=lambda x:float(x.get("score",0) or 0)) if m else None,
                    "all_matches":sorted(m,key=lambda x:(float(x.get("score",0) or 0),x.get("timeframe","") ),reverse=True)[:30],
                    "timeframes":tfs}
        def data_quality_report(rows):
            """Validate candle integrity before using precision levels."""
            if not rows:
                return {"score":0.0,"ok":False,"issues":["NO_DATA"],"duplicate_timestamps":0,"bad_ohlc":0}
            bad_ohlc = 0
            duplicate = 0
            ts = []
            for r in rows:
                try:
                    o,h,l,c = [float(r[k]) for k in ("open","high","low","close")]
                    if not all(math.isfinite(x) for x in (o,h,l,c)) or h < max(o,c) or l > min(o,c) or h < l:
                        bad_ohlc += 1
                except Exception:
                    bad_ohlc += 1
                try: ts.append(parse_ts(r.get("timestamp")))
                except Exception: pass
            for a,b in zip(ts, ts[1:]):
                if b <= a: duplicate += 1
            score = max(0.0, 1.0 - (bad_ohlc + duplicate) / max(len(rows),1))
            issues = ([f"BAD_OHLC={bad_ohlc}"] if bad_ohlc else []) + ([f"NON_MONOTONIC_TS={duplicate}"] if duplicate else [])
            ok = len(rows) >= 80 and score >= MIN_DATA_QUALITY
            if not ok and not issues: issues.append("INSUFFICIENT_HISTORY")
            return {"score":round(score,4),"ok":ok,"issues":issues,"duplicate_timestamps":duplicate,"bad_ohlc":bad_ohlc}
        def volatility_regime(rows):
            """Classify current ATR/price against its recent distribution."""
            if len(rows) < 60: return {"state":"UNKNOWN","ratio":None,"percentile":None}
            vals=[]
            for i in range(30,len(rows)):
                a=atr(rows[:i+1])
                try: px=float(rows[i]["close"])
                except Exception: continue
                if a and px>0: vals.append(a/px)
            if len(vals)<20: return {"state":"UNKNOWN","ratio":None,"percentile":None}
            cur=vals[-1]; rank=sum(x<=cur for x in vals)/len(vals)*100.0
            state="EXTREME_HIGH" if rank>=85 else "HIGH" if rank>=65 else "LOW" if rank<=15 else "NORMAL"
            return {"state":state,"ratio":cur,"percentile":round(rank,1)}
        def liquidity_sweep_setup(rows):
            """Detect a closed-candle sweep through a recent swing followed by a reclaim."""
            if len(rows)<30: return None
            sample=rows[-50:]; last=sample[-1]; av=atr(sample)
            if not av or av<=0: return None
            highs,lows=swings(sample[:-2],2)
            candidates=[]
            for level in [float(x[1]) for x in lows][-5:]:
                if float(last["low"])<level<float(last["close"]):
                    rng=max(float(last["high"])-float(last["low"]),1e-12)
                    candidates.append(("BUY",level,(level-float(last["low"]))/av,abs(float(last["close"])-float(last["open"]))/rng))
            for level in [float(x[1]) for x in highs][-5:]:
                if float(last["high"])>level>float(last["close"]):
                    rng=max(float(last["high"])-float(last["low"]),1e-12)
                    candidates.append(("SELL",level,(float(last["high"])-level)/av,abs(float(last["close"])-float(last["open"]))/rng))
            if not candidates: return None
            side,level,w,b=max(candidates,key=lambda x:(x[2],x[3]))
            return {"side":side,"liquidity_level":level,"wick_atr":round(w,3),"body_ratio":round(b,3),"timestamp":str(last.get("timestamp"))}
        def sniper_style(sniper, side, position_tf):
            """Classify a precision setup as scalp/intraday without treating every WAIT as a confirmed entry."""
            if not isinstance(sniper, dict) or str(sniper.get("type", "")).upper() != "SNIPER":
                return "NONE"
            sniper_side = str(sniper.get("side", "")).upper()
            if sniper_side not in ("BUY", "SELL") or sniper_side != str(side or "").upper():
                return "NONE"
            score = float(sniper.get("score", 0.0) or 0.0)
            tf = str(position_tf or "").lower()
            rr = sniper.get("rr")
            precision_ready = (
                score >= float(SNIPER_MIN_SCORE)
                and rr is not None
                and float(rr) >= float(MIN_CONFIRMED_RR)
                and bool(sniper.get("displacement"))
                and bool(sniper.get("fvg"))
            )
            if precision_ready and tf == "5m":
                return "SNIPER SCALP"
            if precision_ready and tf in ("15m", "1h", "4h"):
                return "SNIPER INTRADAY"
            if score >= float(SNIPER_MIN_SCORE):
                return "SNIPER"
            return "NONE"
        
        def sniper_opportunity(trigger_rows, setup_rows):
            """Precision setup: liquidity sweep + displacement/MSS + fresh FVG + executable target."""
            if len(trigger_rows)<80 or len(setup_rows)<80: return None
            if not data_quality_report(trigger_rows)["ok"] or not data_quality_report(setup_rows)["ok"]: return None
            sweep=liquidity_sweep_setup(trigger_rows)
            if not sweep: return None
            av=atr(trigger_rows)
            if not av or av<=0: return None
            last=trigger_rows[-1]; rng=max(float(last["high"])-float(last["low"]),1e-12); body=abs(float(last["close"])-float(last["open"]))
            prior=[float(x["high"])-float(x["low"]) for x in trigger_rows[-30:-1]]
            med=statistics.median(prior) if prior else rng
            displacement=(body/rng>=0.55 and rng>=1.15*av and rng>=1.20*med)
