        def method_scores(rows):
            """Supporting confirmation layer only. SMC components are evaluated separately by smc_core."""
            methods = []
            funcs = [
                ("Supply/Demand", supply_demand_signal),
                ("Price Action", candle_signal),
                ("Fibonacci", fib_signal),
                ("Trend", trend_signal),
                ("RSI+MACD", indicator_signal),
                ("Session", lambda x: session_signal(x, "")),
            ]
            for name, fn in funcs:
                try:
                    sig, why = fn(rows)
                except Exception as exc:
                    sig, why = "NEUTRAL", f"method error: {type(exc).__name__}"
                points = 1 if sig in ("BUY", "SELL") else 0
                methods.append({"name": name, "signal": sig, "why": why, "points": points})
            return methods
        def method_side_score(methods, side):
            """Directional evidence from supporting methods only; SMC remains primary."""
            if side not in ("BUY", "SELL"):
                return 0.0
            aligned = sum(1 for m in methods if m["signal"] == side)
            opposed = sum(1 for m in methods if m["signal"] in ("BUY", "SELL") and m["signal"] != side)
            total = max(len(methods), 1)
            return max(0.0, min(100.0, (aligned / total) * 100.0 - (opposed / total) * 20.0))
        def dominant_signal(methods, minimum=3):
            b = sum(m["points"] for m in methods if m["signal"] == "BUY")
            s = sum(m["points"] for m in methods if m["signal"] == "SELL")
            if b > s and b >= minimum:
                return "BUY"
            if s > b and s >= minimum:
                return "SELL"
            return "NEUTRAL"
        def select_structural_target(targets, price, risk, min_rr=MIN_CONFIRMED_RR):
            """Return a genuine opposing structural target.
            Prefer the nearest target that already meets the R:R gate; otherwise retain
            the nearest genuine target for a DEVELOPING plan. Never invent or extend TP.
            """
            ordered = sorted(set(float(x) for x in targets))
            if not ordered or risk <= 0:
                return None
            qualifying = [x for x in ordered if abs(x - price) / risk >= float(min_rr)]
            return qualifying[0] if qualifying else ordered[0]
        def levels(rows, side, entry_price=None):
            """Build SL and minimum required R:R TP only when a real opposing structural target supports 2R; otherwise return WAIT/TP_UNSUPPORTED."""
            a = atr(rows)
            if a is None or a <= 0:
                return None
            if entry_price is not None:
                try:
                    candidate_price = float(entry_price)
                except (TypeError, ValueError):
                    candidate_price = rows[-1]["close"]
                price = candidate_price if math.isfinite(candidate_price) and candidate_price > 0 else rows[-1]["close"]
            else:
                price = rows[-1]["close"]
            try:
                base_close = float(rows[-1]["close"])
                if not math.isfinite(base_close) or base_close <= 0:
                    return None
                relative_gap = abs(float(price) - base_close) / base_close
                max_reasonable_gap = min(0.35, max(0.10, 12.0 * a / base_close))
                if relative_gap > max_reasonable_gap:
                    return None
            except (TypeError, ValueError):
                return None
            highs, lows = swings(rows[-100:], 2)
            if side == "BUY":
                stop_candidates = [x[1] for x in lows if x[1] < price]
                if not stop_candidates:
                    return None
                sl = max(stop_candidates[-3:]) - 0.25 * a
                risk = price - sl
                if risk <= 0:
                    return None
                targets = sorted(set(x[1] for x in highs if x[1] > price))
                structural_target = select_structural_target(targets, price, risk, MIN_CONFIRMED_RR)
                if structural_target is None:
                    return price, sl, None, a
                return price, sl, structural_target, a
            if side == "SELL":
                stop_candidates = [x[1] for x in highs if x[1] > price]
                if not stop_candidates:
                    return None
                sl = min(stop_candidates[-3:]) + 0.25 * a
                risk = sl - price
                if risk <= 0:
                    return None
                targets = sorted(set(x[1] for x in lows if x[1] < price), reverse=True)
                structural_target = select_structural_target(targets, price, risk, MIN_CONFIRMED_RR)
                if structural_target is None:
                    return price, sl, None, a
                return price, sl, structural_target, a
            return None
        def rr_ok(level):
            if not level:
                return False
            entry, sl, tp, _ = level
            if entry is None or sl is None or tp is None:
                return False
            risk = abs(entry-sl)
            if risk <= 0:
                return False
            reward = abs(tp-entry)
            return (reward / risk) >= (2.0 - 1e-9)
        def candidate_plan(rows, side, current_price=None, symbol=None):
            """Conditional Entry/SL/TP plan from CLOSED candles only. XAU uses a tighter chase gate without weakening confirmation."""
            if side not in ("BUY", "SELL") or not rows:
                return None
            av = atr(rows)
            if not av or av <= 0:
                return None
            xau_mode = str(symbol or "").upper() == "XAU/USD"
            xau_env = asset_environment("XAU/USD") if xau_mode else {}
            entry_buffer_atr = float(xau_env.get("entry_buffer_atr", ENTRY_BUFFER_ATR)) if xau_mode else ENTRY_BUFFER_ATR
            max_chase_atr = float(xau_env.get("max_chase_atr", ENTRY_MAX_CHASE_ATR)) if xau_mode else ENTRY_MAX_CHASE_ATR
            last = rows[-1]
            reference = closed_breakout_level(rows, side)
            if reference is None:
                return None
            trigger = float(reference + av * entry_buffer_atr) if side == "BUY" else float(reference - av * entry_buffer_atr)
            level = levels(rows, side, entry_price=trigger)
            if not level:
                return None
            entry, sl, structural_tp, atrv = level
            risk = abs(entry-sl)
            if risk <= 0:
                return None
            # TP is the genuine structural target; calculate and report actual R:R.
            tp = structural_tp
            rr = abs(tp-entry)/max(risk,1e-12) if tp is not None else None
            if tp is None:
                return {"entry":entry,"sl":sl,"tp":None,"structural_tp":None,"rr":None,"atr":atrv,"entry_trigger":entry,
                        "current_price":None,"trigger_crossed":False,"distance_atr":None,"entry_mode":"STRUCTURAL_BREAKOUT_FROM_CLOSED_CANDLE",
                        "reference_candle":str(last.get("timestamp")),"status":"WAIT","tp_status":"TP_UNSUPPORTED","tp_reason":"No genuine opposing structural target is available"}
            if rr < MIN_CONFIRMED_RR:
                return {"entry":entry,"sl":sl,"tp":None,"structural_tp":structural_tp,"rr":rr,"atr":atrv,"entry_trigger":entry,
                        "current_price":None,"trigger_crossed":False,"distance_atr":None,"entry_mode":"STRUCTURAL_BREAKOUT_FROM_CLOSED_CANDLE",
                        "reference_candle":str(last.get("timestamp")),"status":"WAIT","tp_status":"TP_DEVELOPING","tp_reason":"Genuine structural target exists but does not yet meet minimum required R:R"}
            current = None
            if current_price is not None:
                try:
                    candidate = float(current_price)
                    if math.isfinite(candidate) and candidate > 0:
                        current = candidate
                except (TypeError, ValueError):
                    current = None
            if current is None:
                return {"entry":entry,"sl":sl,"tp":tp,"structural_tp":structural_tp,"rr":rr,"atr":atrv,"entry_trigger":entry,
                        "current_price":None,"trigger_crossed":False,"distance_atr":None,
                        "entry_mode":"STRUCTURAL_BREAKOUT_FROM_CLOSED_CANDLE",
                        "reference_candle":str(last.get("timestamp")),"status":"PENDING_LIVE_PRICE"}
            distance = abs(current-entry)/max(av,1e-12)
            crossed = current >= entry if side == "BUY" else current <= entry
            state = "TRIGGERED" if crossed and distance <= max_chase_atr else ("OVEREXTENDED" if crossed else "PENDING")
            return {"entry":entry,"sl":sl,"tp":tp,"structural_tp":structural_tp,"rr":rr,"atr":atrv,"entry_trigger":entry,
                    "current_price":current,"trigger_crossed":crossed,"distance_atr":distance,
                    "entry_mode":"STRUCTURAL_BREAKOUT_FROM_CLOSED_CANDLE","reference_candle":str(last.get("timestamp")),"status":state}
        def safe_call(fn, *args, **kwargs):
            """Bounded retry for transient LSE vault saturation/timeouts; never retries bad requests indefinitely."""
            last = None
            for attempt in range(API_MAX_RETRIES):
                try:
                    return fn(*args, **kwargs)
                except Exception as exc:
                    last = exc
                    msg = str(exc).lower()
                    transient = (
                        "503" in msg or "502" in msg or "504" in msg or
                        "timeout" in msg or "timed out" in msg or
                        "temporarily" in msg or "saturated" in msg
                    )
                    if not transient or attempt == API_MAX_RETRIES - 1:
                        break
                    time.sleep(API_RETRY_BASE_SECONDS * (2 ** attempt))
            return {"_error": f"{type(last).__name__}: {last}"}
        def as_list(x):
            if isinstance(x, list):
                return x
            if isinstance(x, dict):
                for k in ("data", "rows", "results"):
                    if isinstance(x.get(k), list):
                        return x[k]
            return []
        def external_news():
            """Fetch a small, bounded RSS set without letting one feed stall the scan."""
            items = []
            seen = set()
            for url in NEWS_URLS[:8]:
                try:
                    req = Request(
                        url,
                        headers={"User-Agent": "LSE-Smart-Scanner/12.2"},
                    )
                    with urlopen(req, timeout=8) as response:
                        raw = response.read(1_500_000)
                    feed = feedparser.parse(raw)
                    source = urlparse(url).netloc or url
                    if getattr(feed, "bozo", False) and not getattr(feed, "entries", []):
                        print(f"RSS WARNING: {source}: malformed/empty feed")
                        continue
                    for entry in feed.entries[:8]:
                        title = str(entry.get("title", "")).strip()
                        link = str(entry.get("link", "")).strip()
                        if not title:
                            continue
                        key = (title.casefold(), link)
                        if key in seen:
                            continue
                        seen.add(key)
                        published_at = None
                        for field in ("published_parsed", "updated_parsed"):
