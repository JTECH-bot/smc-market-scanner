        print(f"LSE REQUEST GOVERNOR: floor={API_MIN_INTERVAL_SECONDS:.2f}s | 429 cooldown={API_429_COOLDOWN_SECONDS:.1f}-{API_429_MAX_COOLDOWN_SECONDS:.1f}s | per-run candle cache=ON")
        RUNTIME_MINUTES = env_float("SCAN_RUNTIME_MINUTES", 8.0)
