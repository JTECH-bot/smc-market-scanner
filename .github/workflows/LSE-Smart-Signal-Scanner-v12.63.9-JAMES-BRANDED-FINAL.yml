                    out["prior_period_high"] = float(prev["high"])
                    out["prior_period_low"] = float(prev["low"])
                hi, lo = out["recent_high"], out["recent_low"]
                rng = hi - lo
                if rng > 0:
                    out["fib_382"] = hi - rng * 0.382
                    out["fib_500"] = hi - rng * 0.500
                    out["fib_618"] = hi - rng * 0.618
                p = pip_size(symbol) if symbol else None
                if p:
