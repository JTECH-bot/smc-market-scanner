            def btc_special_analysis(candles, ticks, execution_model):
                """BTC-only regime layer. Order-flow/liquidation fields are proxies unless full LOB/funding/OI feeds are available."""
                out = {
                    "active": False, "market": "BTC_24H_CRYPTO_ENV", "regime": "UNKNOWN",
                    "volatility_state": "UNKNOWN", "liquidity_state": "UNKNOWN",
                    "order_flow_proxy": "UNAVAILABLE", "liquidation_risk": "UNAVAILABLE",
                    "weekend_mode": False, "chase_risk": "UNKNOWN",
                    "reason": "not BTC/USD"
                }
                if not candles:
                    return out
                try:
                    rows = [r for r in candles[-48:] if all(r.get(k) is not None for k in ("open","high","low","close"))]
                    if len(rows) < 10:
                        return out
                    closes = [float(r["close"]) for r in rows]
                    ranges = [max(0.0, float(r["high"])-float(r["low"])) for r in rows]
                    atr = sum(ranges[-14:]) / max(1, min(14, len(ranges)))
                    recent_range = sum(ranges[-5:]) / 5.0
                    baseline_range = sum(ranges[-20:-5]) / max(1, len(ranges[-20:-5]))
                    vol_ratio = recent_range / baseline_range if baseline_range > 0 else 1.0
                    ret = (closes[-1] / closes[-6] - 1.0) if closes[-6] else 0.0
                    body = abs(closes[-1] - float(rows[-1]["open"])) / max(atr, 1e-12)
                    if vol_ratio >= 1.8 or body >= 1.5:
                        vol_state = "HIGH"
                    elif vol_ratio <= 0.65:
                        vol_state = "COMPRESSED"
                    else:
                        vol_state = "NORMAL"
                    if abs(ret) >= 0.012 and vol_state == "HIGH":
                        regime = "EXPANSION"
                    elif vol_state == "COMPRESSED":
                        regime = "COMPRESSION"
                    else:
                        regime = "BALANCED"
                    if ret > 0.001:
                        flow = "BUY_PRESSURE_PROXY"
                    elif ret < -0.001:
                        flow = "SELL_PRESSURE_PROXY"
                    else:
                        flow = "BALANCED_FLOW_PROXY"
