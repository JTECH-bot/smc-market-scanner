python - <<'PY'\\n(.*?)\\nPY\", scan_runs, flags=re.S)\nassert blocks, \"No embedded scanner Python block found\"\nfor i, b in enumerate(blocks, 1):\n    ast.parse(b, filename=f\"scanner_block_{i}.py\")\nprint(\"Scanner-only validation: PASS | live LSE only | 1MO/1D/4H/1H/15M/5M | scanner job only\")\nPY\n"
