            def opportunity_timing(symbol, execution_tf, side, level, status):
                """Give WAIT candidates a concrete re-evaluation time and a conditional watch window without predicting a future signal."""
                tf_minutes = {"5m":5, "15m":15, "1h":60, "4h":240, "1d":1440}
                tf = str(execution_tf or "15m").lower()
                minutes = tf_minutes.get(tf, 15)
                now = now_utc().replace(second=0, microsecond=0)
                total = now.hour * 60 + now.minute
                next_total = ((total // minutes) + 1) * minutes
                days = next_total // 1440
                next_dt = now.replace(hour=0, minute=0) + timedelta(days=days, minutes=next_total % 1440)
                env = asset_environment(symbol)
                expiry = int(env.get("expiry_minutes", {}).get(tf, max(minutes * 3, 15)))
                # WAIT is a monitoring window, not a promise that price will trigger.
                window_start = next_dt
                window_end = next_dt + timedelta(minutes=expiry)
                eat = timezone(timedelta(hours=3))
                out = {
                    "status": "MONITORING_WINDOW" if status != "CONFIRMED_ENTRY" else "ACTIVE_ENTRY_WINDOW",
                    "execution_timeframe": tf,
                    "re_evaluate_at_utc": next_dt.isoformat(),
                    "re_evaluate_at_eat": next_dt.astimezone(eat).isoformat(),
                    "potential_window_start_utc": window_start.isoformat(),
                    "potential_window_end_utc": window_end.isoformat(),
                    "potential_window_start_eat": window_start.astimezone(eat).isoformat(),
                    "potential_window_end_eat": window_end.astimezone(eat).isoformat(),
                    "window_duration_minutes": expiry,
                    "time_basis": "next closed execution candle + asset-specific monitoring expiry",
                    "timezone": "UTC + EAT (Africa/Nairobi)",
                }
