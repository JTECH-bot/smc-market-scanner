            def opportunity_timing_bucket(timing):
                """Categorize time until the next scheduled execution-candle recheck; never predict a future trigger."""
                if not isinstance(timing, dict):
                    return "WATCH"
                try:
                    recheck = parse_ts(timing.get("re_evaluate_at_utc"))
                    minutes = max(0.0, (recheck - now_utc()).total_seconds() / 60.0)
                except Exception:
                    return "WATCH"
                if minutes <= 3:
                    return "IMMEDIATE_0_3M"
                if minutes <= 5:
                    return "VERY_NEAR_3_5M"
                if minutes <= 10:
                    return "NEAR_5_10M"
                if minutes <= 15:
                    return "NEAR_10_15M"
                if minutes <= 30:
                    return "WATCH_15_30M"
                if minutes <= 60:
                    return "WATCH_30_60M"
                return "LATER_60M_PLUS"
        
            def signal_validity_for(symbol, status, trade_type, position_tf, execution_model, reference_timestamp):
                env = asset_environment(symbol)
                ttl_key = {"SCALP":"5m","INTRADAY":"15m","SWING/HOLD":"1h","ADAPTIVE PRICE-MOVEMENT":"15m"}.get(trade_type, position_tf)
                ttl_minutes = float(env.get("expiry_minutes", {}).get(ttl_key, 30))
                try:
                    ref_dt = parse_ts(reference_timestamp)
                except Exception:
                    ref_dt = now_utc()
                expires_at = ref_dt + timedelta(minutes=ttl_minutes)
                now = now_utc()
                expired = now >= expires_at
                remaining_minutes = max(0.0, (expires_at - now).total_seconds() / 60.0)
                reference_age_minutes = max(0.0, (now - ref_dt).total_seconds() / 60.0)
                minimum_lead_ok = remaining_minutes >= float(EARLY_ENTRY_MINUTES)
                early_reference_ok = reference_age_minutes >= float(EARLY_ENTRY_MINUTES)
                exec_state = str((execution_model or {}).get("state", "UNAVAILABLE"))
                if expired:
                    validity = "EXPIRED"
                    reason = f"signal lifetime {ttl_minutes:.0f}m elapsed from closed-candle reference"
                elif status.startswith("CONFIRMED ") and exec_state == "EXECUTABLE_TRIGGER_CROSSED" and minimum_lead_ok and early_reference_ok:
                    validity = "VALID NOW | 3M WINDOW"
                    reason = "live executable bid/ask crossed the trigger while at least 3 minutes remain in the signal lifetime"
                elif exec_state == "WAITING_FOR_TRIGGER" and early_reference_ok and minimum_lead_ok:
                    validity = "CONDITIONAL | 3M WINDOW"
                    reason = "structure is active; reference candle is at least 3 minutes old and at least 3 minutes remain before expiry"
                elif not early_reference_ok or not minimum_lead_ok:
                    validity = "INVALID — 3M WINDOW"
                    reason = f"minimum 3-minute control window not satisfied: reference_age={reference_age_minutes:.2f}m, remaining={remaining_minutes:.2f}m"
                elif exec_state in ("STALE_QUOTE","WIDE_SPREAD","MICROSTRUCTURE_UNSTABLE","OVEREXTENDED"):
