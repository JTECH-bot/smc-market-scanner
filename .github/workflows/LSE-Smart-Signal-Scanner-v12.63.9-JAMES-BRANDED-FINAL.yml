        def top_opportunity_quality_gate(r):
            # This is a display/qualification gate only; it never creates a trade.
            if str(r.get("symbol", "")).upper() not in TOP_OPPORTUNITY_SYMBOLS:
                return False
            if r.get("side") not in ("BUY", "SELL"):
                return False
            deep_score = float(r.get("strategy_score", 0.0) or 0.0)
            execution_quality = float(r.get("execution_quality_score", 0.0) or 0.0)
            strategy_count = int(r.get("confirmed_strategy_count", 0) or 0)
            rr = r.get("rr")
            tp = r.get("take_profit")
            tp_status = str(r.get("tp_status", ""))
            rr_ok = rr is not None and float(rr) >= TOP_OPPORTUNITY_MIN_RR
            tp_ok = tp is not None and tp_status == "VALID_STRUCTURAL_RR"
            quality_ok = (
                deep_score >= TOP_OPPORTUNITY_MIN_DEEP_SCORE
                and execution_quality >= TOP_OPPORTUNITY_MIN_EXECUTION_QUALITY
                and strategy_count >= TOP_OPPORTUNITY_MIN_STRATEGIES
                and rr_ok and tp_ok
            )
            if not quality_ok:
                return False
            if r.get("status") == "CONFIRMED_ENTRY":
                return (r.get("event_alignment") or {}).get("state") in ("ALIGNED", "EXECUTABLE")
            return r.get("status") in ("WAITING_FOR_TRIGGER", "CONFIRMED_ENTRY", "NO_ACTION", "WAIT/TP_UNSUPPORTED")

