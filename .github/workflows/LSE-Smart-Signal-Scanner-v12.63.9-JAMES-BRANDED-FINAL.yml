                    validity = "NOT VALID — NO ACTION"
                    reason = "no qualifying directional setup"
                else:
                    validity = "CONDITIONAL"
                    reason = "setup exists but execution confirmation is incomplete"
                return {
                    "state": validity,
                    "created_at": ref_dt.isoformat(),
                    "expires_at": expires_at.isoformat(),
                    "ttl_minutes": ttl_minutes,
                    "expired": expired,
                    "remaining_minutes": round(remaining_minutes, 3),
