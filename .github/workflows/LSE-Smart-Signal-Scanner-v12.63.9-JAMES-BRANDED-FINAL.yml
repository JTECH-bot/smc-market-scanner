                 "high_quality_score": EXECUTION_HIGH_QUALITY_SCORE
             },
                "execution_side_rule": "BUY uses ASK for trigger/fill readiness; SELL uses BID; mid/last is never substituted for the executable side.",
            },
            "strategy_definitions": ["SMC","Market Structure","Liquidity","Supply/Demand","Price Action","Fibonacci","Trend","RSI+MACD","Session"],
            "minimum_confirmed_strategies": MIN_CONFIRMED_STRATEGIES,
            "strategy_engine": {
                 "name": "9_STRATEGY_CONSENSUS",
                 "status": STRATEGY_ENGINE_STATUS,
                 "reason": STRATEGY_ENGINE_REASON,
                 "minimum_confirmed_strategies": MIN_CONFIRMED_STRATEGIES,
                 "required_for_confirmed_entry": True
            },
        }
        output_path = os.getenv("SCANNER_JSON", "scan_results.json")
        with open(output_path, "w", encoding="utf-8") as fh:
            json.dump(payload, fh, ensure_ascii=False, default=str)
        print(f"JSON HANDOFF: {output_path}")
        PY
        }
        if [ "${SCAN_MODE}" = "UNTIL_POSITION" ]; then
          max_minutes="${UNTIL_POSITION_MAX_MINUTES:-55}"
          poll_seconds="${POLL_SECONDS:-30}"
          case "$max_minutes" in
            ''|*[!0-9]*) max_minutes=55 ;;
          esac
          case "$poll_seconds" in
            ''|*[!0-9]*) poll_seconds=30 ;;
          esac
          if [ "$max_minutes" -lt 1 ]; then max_minutes=1; fi
          if [ "$max_minutes" -gt 55 ]; then max_minutes=55; fi
          if [ "$poll_seconds" -lt 5 ]; then poll_seconds=5; fi
          if [ "$poll_seconds" -gt 300 ]; then poll_seconds=300; fi
          deadline=$(( $(date +%s) + max_minutes * 60 ))
          cycle=0
          echo "🔎 UNTIL_POSITION mode enabled: full multi-timeframe rescans continue until a confirmed position is found or the safety limit expires."
          while true; do
            cycle=$((cycle + 1))
            echo "========== SCAN CYCLE ${cycle} =========="
            scan_once
            if python -c 'import json; d=json.load(open("scan_results.json", encoding="utf-8")); raise SystemExit(0 if any(str(x.get("status","")).startswith("CONFIRMED ") for x in d.get("entries", [])) else 1)'; then
              echo "✅ CONFIRMED POSITION FOUND — stopping repeated scan cycles."
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "⏱️ UNTIL_POSITION safety limit reached without a confirmed position."
              break
            fi
            echo "🟡 No confirmed position yet. Waiting ${poll_seconds}s before the next full scan."
            sleep "$poll_seconds"
          done
        else
          scan_once
          python -c 'import json; json.load(open("scan_results.json", encoding="utf-8")); print("✅ SCAN REPORT JSON VALID — no-opportunity/WAIT states are valid outcomes.")'
        fi
    - name: Install branded JTECH Telegram formatter
      if: ${{ success() && hashFiles('scan_results.json') != '' }}
      shell: bash
      run: |
        set -euo pipefail
        python -c 'import base64; from pathlib import Path; Path("telegram_notify.py").write_bytes(base64.b64decode(""))'
        python -m py_compile telegram_notify.py

    - name: Send final scanner report to Telegram
      if: ${{ success() && hashFiles('scan_results.json') != '' }}
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        # Optional. If omitted, telegram_notify.py discovers the latest incoming chat.
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SCANNER_JSON: scan_results.json
      run: |
        set -euo pipefail
        python telegram_notify.py

    - name: Upload scanner results
      if: ${{ success() && hashFiles('scan_results.json') != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: scanner-results
        path: scan_results.json
        if-no-files-found: error
    if: ${{ always() && needs.validate_workflow.result == 'success' }}
on:
  workflow_dispatch:
    inputs:
      confirmation_monitor:
        description: "Run the independent Telegram confirmation monitor"
        required: false
        default: false
        type: boolean
      monitor_minutes:
        description: "Maximum monitor duration in minutes"
        required: false
        default: "180"
        type: string
      monitor_interval_seconds:
        description: "Live recheck interval in seconds"
        required: false
        default: "60"
        type: string

      max_instruments:
        description: Fast scan covers the configured universe; deep Top Opportunity analysis is restricted to XAU/USD, EUR/USD, BTC/USD
        required: false
        default: '0'
        type: string
      categories:
        description: Informational catalog categories; fast scan uses the configured universe and Top Opportunity analysis remains fixed to XAU/USD, EUR/USD, BTC/USD
        required: false
        default: forex,commodity,crypto
        type: string
      top_n:
        description: Number of qualified setups / WAIT candidates to display
        required: false
        default: '5'
        type: string
      runtime_minutes:
        description: Maximum scanner runtime in minutes; 0 uses the safe default
        required: false
        default: '4'
        type: string
      scan_mode:
        description: ONCE = one complete scan; UNTIL_POSITION = repeat full scans until a confirmed position is found or the safety limit is reached
        required: false
        default: ONCE
        type: choice
        options:
        - ONCE
        - UNTIL_POSITION
      until_position_max_minutes:
        description: Safety limit for UNTIL_POSITION mode (maximum 55 minutes)
        required: false
        default: '55'
        type: string
      fast_candidate_limit:
        description: Maximum instruments promoted from the fast 1H/15M/5M filter to deep analysis
        required: false
        default: '8'
        type: string
      fast_min_score:
        description: Minimum fast-filter opportunity score to promote an instrument; lower values show more potential setups without changing confirmed-entry gates
        required: false
        default: '50'
        type: string
      lse_request_min_interval:
        description: Global minimum interval between interactive LSE candle requests; conservative default prevents plan-level 429 cascades
        required: false
        default: '1.20'
        type: string
      lse_429_cooldown:
        description: Initial cooldown after an LSE HTTP 429
        required: false
        default: '12'
        type: string
  schedule:
  - cron: 5,20,35,50 * * * *
