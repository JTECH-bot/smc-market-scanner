            if strongest is None: return {"state":"NONE","gate":True,"score_adjustment":0.0,"events":[],"reason":"No timestamped relevant event in the execution window"}
            d=strongest["delta_min"]
            if strongest["severity"] == "HIGH" and -10 <= d <= 15:
                return {"state":"IMMEDIATE_HIGH","gate":False,"score_adjustment":-20.0,"events":records[:5],"reason":"Immediate high-impact release window; wait for initial volatility to settle"}
            if -120 <= d < -10:
                def reaction(rows,bars):
                    if len(rows)<bars+2: return 0.0
                    a,b=rows[-bars-1]["close"],rows[-1]["close"]
                    return (b/a-1.0) if a else 0.0
