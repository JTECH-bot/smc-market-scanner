name: LSE Smart Scanner v12.52.1 — Single Authoritative Context Resolver

on:
  workflow_dispatch:
    inputs:
      max_instruments:
        description: "Maximum focused instruments; 0 = all instruments discovered from the live LSE catalog"
        required: false
        default: "0"
        type: string
      categories:
        description: "Requested LSE categories"
        required: false
        default: "forex,commodity,crypto"
        type: string
      top_n:
        description: "Number of top results per output bucket"
        required: false
        default: "5"
        type: string
      runtime_minutes:
        description: "Scanner runtime budget in minutes (scanner caps this at 10)"
        required: false
        default: "8"
        type: string

permissions:
  contents: read

concurrency:
  group: lse-smart-scanner-authoritative
  cancel-in-progress: true

jobs:
  scan:
    name: Run authoritative LSE scanner
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      LSE_API_KEY: ${{ secrets.LSE_API_KEY }}
      NEWS_RSS_URLS: ${{ secrets.NEWS_RSS_URLS }}
      MAX_INSTRUMENTS: ${{ inputs.max_instruments }}
      LSE_CATEGORIES: ${{ inputs.categories }}
      TOP_N: ${{ inputs.top_n }}
      SCAN_RUNTIME_MINUTES: ${{ inputs.runtime_minutes }}
      SCANNER_JSON: scan_results.json
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-v12.52.1-FIXED.txt

      - name: Validate required secrets and scanner files
        shell: bash
        run: |
          set -euo pipefail

          test -n "${LSE_API_KEY:-}" || {
            echo "::error::LSE_API_KEY secret is missing."
            exit 1
          }

          test -f "scanner_engine_telegram-v12.52.1-FIXED.py" || {
            echo "::error::scanner_engine_telegram-v12.52.1-FIXED.py is missing."
            exit 1
          }

          test -f "requirements-v12.52.1-FIXED.txt" || {
            echo "::error::requirements-v12.52.1-FIXED.txt is missing."
            exit 1
          }

          python -m py_compile "scanner_engine_telegram-v12.52.1-FIXED.py"
          echo "Scanner Python syntax validation: PASS"
          echo "LSE_API_KEY present: YES"
          echo "NEWS_RSS_URLS configured: $([[ -n "${NEWS_RSS_URLS:-}" ]] && echo YES || echo NO — external news will be unavailable)"

      - name: Install scanner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-v12.52.1-FIXED.txt

      - name: Run authoritative scanner
        id: scanner
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python "scanner_engine_telegram-v12.52.1-FIXED.py" 2>&1 | tee scanner.log

      - name: Validate machine-readable handoff
        id: handoff
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -s "scan_results.json" ]]; then
            echo "::error::Scanner did not create scan_results.json."
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("scan_results.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          required = [
              "version",
              "generated_at",
              "entries",
              "sniper_entries",
              "intraday_entries",
              "scalp_entries",
              "swing_entries",
              "adaptive_entries",
              "setup_waiting",
              "potential",
              "waiting",
              "complete",
              "incomplete",
              "processed",
              "errors",
              "catalog_count",
              "eligible_count",
              "intelligence",
              "runtime_seconds",
          ]

          missing = [k for k in required if k not in data]
          if missing:
              raise SystemExit(f"Missing JSON handoff fields: {missing}")

          print("JSON HANDOFF VALID: PASS")
          print(f"Version: {data['version']}")
          print(f"Entries: {len(data['entries'])}")
          print(f"Potential: {len(data['potential'])}")
          print(f"Waiting: {len(data['waiting'])}")
          print(f"Processed: {data['processed']}")
          print(f"Complete: {data['complete']}")
          print(f"Incomplete: {data['incomplete']}")
          print(f"Errors: {data['errors']}")
          print(f"Catalog: {data['catalog_count']}")
          print(f"Eligible: {data['eligible_count']}")
          PY

      - name: Send validated result to Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          SCANNER_OUTCOME: ${{ steps.scanner.outcome }}
          HANDOFF_OUTCOME: ${{ steps.handoff.outcome }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "${BOT_TOKEN:-}" || {
            echo "::error::BOT_TOKEN secret is missing."
            exit 1
          }

          test -n "${TELEGRAM_GROUP_CHAT_ID:-}" || {
            echo "::error::TELEGRAM_GROUP_CHAT_ID secret is missing."
            exit 1
          }

          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          token = os.environ["BOT_TOKEN"].strip()
          chat_id = os.environ["TELEGRAM_GROUP_CHAT_ID"].strip()
          scanner_outcome = os.environ.get("SCANNER_OUTCOME", "unknown")
          handoff_outcome = os.environ.get("HANDOFF_OUTCOME", "unknown")

          api = f"https://api.telegram.org/bot{token}/sendMessage"

          def send(text):
              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": text,
                  "disable_web_page_preview": "true",
              }).encode()
              req = urllib.request.Request(
                  api,
                  data=payload,
                  headers={"Content-Type": "application/x-www-form-urlencoded"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=35) as response:
                  body = json.loads(response.read().decode("utf-8"))
              if not body.get("ok"):
                  raise RuntimeError(body)
              return body

          def chunk(text, limit=3900):
              return [text[i:i + limit] for i in range(0, len(text), limit)] or [""]

          path = Path("scan_results.json")

          if path.exists() and path.stat().st_size:
              data = json.loads(path.read_text(encoding="utf-8"))

              def count(name):
                  value = data.get(name, [])
                  return len(value) if isinstance(value, list) else 0

              entries = data.get("entries", [])
              intelligence = data.get("intelligence", {}) or {}
              news_count = len(intelligence.get("news", []) or [])
              calendar_count = len(intelligence.get("calendar", []) or [])
              yields = intelligence.get("yields", {}) or {}
              cot = intelligence.get("cot", {}) or {}

              lines = [
                  "📡 LSE SMART SCANNER v12.52.1",
                  "",
                  f"Status: {'VALIDATED RESULT' if scanner_outcome == 'success' and handoff_outcome == 'success' else 'DEGRADED / CHECK LOG'}",
                  f"Generated: {data.get('generated_at', 'UNKNOWN')}",
                  "",
                  "🎯 ENTRIES",
                  f"Confirmed total: {count('entries')}",
                  f"Sniper: {count('sniper_entries')}",
                  f"Intraday: {count('intraday_entries')}",
                  f"Scalp: {count('scalp_entries')}",
                  f"Swing/Hold: {count('swing_entries')}",
                  f"Adaptive price-movement: {count('adaptive_entries')}",
                  "",
                  "🟡 WAIT / POTENTIAL",
                  f"Valid setups waiting: {count('setup_waiting')}",
                  f"Potential: {count('potential')}",
                  f"Wait: {count('waiting')}",
                  "",
                  "📊 SCAN",
                  f"Catalog discovered: {data.get('catalog_count', 0)}",
                  f"Eligible: {data.get('eligible_count', 0)}",
                  f"Processed: {data.get('processed', 0)}",
                  f"Fully analyzed: {data.get('complete', 0)}",
                  f"Incomplete: {data.get('incomplete', 0)}",
                  f"Errors: {data.get('errors', 0)}",
                  f"Runtime: {float(data.get('runtime_seconds', 0) or 0):.1f}s",
                  "",
                  "🧠 DAILY INTELLIGENCE",
                  f"Calendar records: {calendar_count}",
                  f"Macro: {'AVAILABLE' if (intelligence.get('macro', {}) or {}).get('cpi_yoy') or (intelligence.get('macro', {}) or {}).get('policy_rate') else 'UNAVAILABLE'}",
                  f"Government yields: {', '.join(sorted(yields)) if yields else 'UNAVAILABLE'}",
                  f"COT: {', '.join(sorted(cot)) if cot else 'UNAVAILABLE'}",
                  f"External news: {news_count}",
                  f"Live feed: {intelligence.get('live', 'UNKNOWN')}",
                  "ML: LOCAL STATISTICAL MODEL",
                  "",
                  "Automatic trading: DISABLED",
              ]

              # Include the top confirmed entries without risking Telegram's 4096-char limit.
              for bucket_name, key in (
                  ("SNIPER", "sniper_entries"),
                  ("INTRADAY", "intraday_entries"),
                  ("SCALP", "scalp_entries"),
                  ("SWING/HOLD", "swing_entries"),
                  ("ADAPTIVE", "adaptive_entries"),
              ):
                  bucket = data.get(key, []) or []
                  for item in bucket[:5]:
                      levels = item.get("levels") or []
                      rr = item.get("rr")
                      rr_text = f"{float(rr):.2f}R" if rr is not None else "UNAVAILABLE"
                      line = (
                          f"• {item.get('symbol')} | {item.get('side')} | {bucket_name} | "
                          f"score {float(item.get('score', 0) or 0):.1f} | R:R {rr_text}"
                      )
                      if levels and len(levels) >= 3:
                          line += f" | Entry {levels[0]:.6g} SL {levels[1]:.6g} TP {levels[2]:.6g}"
                      lines.append(line)

              if not entries:
                  lines.extend([
                      "",
                      "⛔ NO CONFIRMED ENTRY",
                      "No setup passed the configured strategy + real 2R + news gates.",
                  ])

              text = "\n".join(lines)
          else:
              text = (
                  "🔴 LSE SMART SCANNER v12.52.1 FAILED\n\n"
                  f"Scanner outcome: {scanner_outcome}\n"
                  f"JSON handoff: {handoff_outcome}\n"
                  "No validated scan_results.json was produced. Check the GitHub Actions log."
              )

          for part in chunk(text):
              send(part)
              time.sleep(0.25)

          print("Telegram result delivery: PASS")
          PY

      - name: Upload scanner diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lse-smart-scanner-v12.52.1-${{ github.run_id }}
          path: |
            scan_results.json
            scanner.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fail workflow if scanner or handoff failed
        if: always()
        shell: bash
        env:
          SCANNER_OUTCOME: ${{ steps.scanner.outcome }}
          HANDOFF_OUTCOME: ${{ steps.handoff.outcome }}
        run: |
          set -euo pipefail

          if [[ "${SCANNER_OUTCOME}" != "success" ]]; then
            echo "::error::Authoritative scanner execution failed."
            exit 1
          fi

          if [[ "${HANDOFF_OUTCOME}" != "success" ]]; then
            echo "::error::Machine-readable scan handoff validation failed."
            exit 1
          fi

          echo "Authoritative scanner workflow completed successfully."
