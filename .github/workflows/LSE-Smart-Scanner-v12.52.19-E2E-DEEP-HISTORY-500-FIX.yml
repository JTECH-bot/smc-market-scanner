    - name: Upload TCA artifacts
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: historical-tick-replay-tca
        path: 'execution_calibration.json

          execution_tca.json

          execution_tca.csv

          tick_history_diagnostics.json

          tca_qualification_diagnostics.json

          historical_tick_cache/

          '
        if-no-files-found: warn
'on':
  workflow_dispatch:
    inputs:
      max_instruments:
        description: Fixed four-symbol study; this input cannot reduce the required BTC/USD, EUR/USD, GBP/USD, XAU/USD universe
        required: false
        default: '0'
        type: string
      categories:
        description: Informational catalog categories; fixed study symbols are always evaluated regardless of this filter
        required: false
        default: forex,commodity,crypto
        type: string
      top_n:
        description: Number of qualified setups / WAIT candidates to display
        required: false
        default: '5'
        type: string
      runtime_minutes:
        description: Maximum scanner runtime in minutes; 0 uses the safe default
        required: false
        default: '8'
        type: string
      scan_mode:
        description: ONCE = one complete scan; UNTIL_POSITION = repeat full scans until a confirmed position is found or the safety limit is reached
        required: false
        default: ONCE
        type: choice
        options:
        - ONCE
        - UNTIL_POSITION
      until_position_max_minutes:
        description: Safety limit for UNTIL_POSITION mode (maximum 55 minutes)
        required: false
        default: '55'
        type: string
      fast_candidate_limit:
        description: Maximum instruments promoted from the fast 1H/15M/5M filter to deep analysis
        required: false
        default: '8'
        type: string
      fast_min_score:
        description: Minimum fast-filter opportunity score to promote an instrument; lower values show more potential setups without changing confirmed-entry gates
        required: false
        default: '50'
        type: string
      lse_request_min_interval:
        description: Global minimum interval between interactive LSE candle requests; conservative default prevents plan-level 429 cascades
        required: false
        default: '1.20'
        type: string
      lse_429_cooldown:
        description: Initial cooldown after an LSE HTTP 429
        required: false
        default: '12'
        type: string
      run_tca:
        description: Run historical tick replay + execution TCA calibration; uses the LSE WebSocket historical source and automatically feeds E2E.
        required: false
        default: false
        type: boolean
      tca_start:
        description: UTC replay start (ISO timestamp); blank = newest catalog-backed 23h30m window. WebSocket replay is attempted first; if zero/insufficient, validated vault history is used and filtered locally to the exact resolved UTC window.
        required: false
        default: ''
        type: string
      tca_end:
        description: UTC replay end (ISO timestamp); blank = now. Historical ticks are filtered locally to this exact UTC window.
        required: false
        default: ''
        type: string
      deep_history_start:
        description: Deep candle reconstruction start date; default 2021-01-01. Independent of bounded execution tick replay.
        required: false
        default: '2021-01-01'
        type: string
      deep_history_end:
        description: Deep candle reconstruction end date; blank = now.
        required: false
        default: ''
        type: string
      deep_history_warmup_days:
        description: Pre-start warmup days used to stabilize indicators; decisions remain limited to DEEP_HISTORY_START onward.
        required: false
        default: '370'
        type: string
      run_e2e:
        description: 'Run historical institutional single-engine end-to-end replay: closed-candle signal -> trigger -> executable bid/ask fill -> MFE/MAE -> TP/SL'
        required: false
        default: false
        type: boolean
      e2e_start:
        description: UTC E2E replay start (ISO timestamp); blank = newest catalog-backed 23h30m window. WebSocket replay is attempted first; if zero/insufficient, validated vault history is used and filtered locally to the exact resolved UTC window.
        required: false
        default: ''
        type: string
      e2e_end:
        description: UTC E2E replay end (ISO timestamp); blank = now. Historical ticks are filtered locally to this exact UTC window.
        required: false
        default: ''
        type: string
      e2e_max_setups:
        description: Maximum retained historical qualified signal setups across the full deep period; deterministic reservoir sampling preserves coverage across 2021-to-now.
        required: false
        default: '1500'
        type: string
      e2e_horizon_minutes:
        description: Maximum historical holding horizon used for realized TP/SL and MFE/MAE
        required: false
        default: '240'
        type: string
  schedule:
  - cron: 5,20,35,50 * * * *
