        MEAN REVERSION\")\n    return labels or [\"MULTI-TF CONSENSUS\"]\ndef displacement_signal(rows):\n    \"\"\"Closed-candle displacement direction; neutral when the candle is not directional enough.\"\"\"\n    if len(rows) < 25 or not _displacement(rows):\n        return \"NEUTRAL\", \"no qualifying displacement\"\n    c = rows[-1]\n    if float(c[\"close\"]) > float(c[\"open\"]):\n        return \"BUY\", \"bullish displacement\"\n    if float(c[\"close\"]) < float(c[\"open\"]):\n        return \"SELL\", \"bearish displacement\"\n    return \"NEUTRAL\", \"flat displacement candle\"\ndef smc_core(rows):\n    \"\"\"Primary institutional SMC engine with structure, MSS, liquidity, FVG and validated displacement evidence.\"\"\"\n    structure_sig, structure_why = structure_signal(rows)\n    mss_sig, mss_why = smc_signal(rows)\n    liq_sig, liq_why = liquidity_signal(rows)\n    fvg_sig, fvg_why, fvg = fvg_signal(rows)\n    displacement_sig, displacement_why = displacement_signal(rows)\n\
        \    votes = [\n        (\"Structure\", structure_sig, structure_why),\n        (\"MSS/CHoCH\", mss_sig, mss_why),\n        (\"Liquidity\", liq_sig, liq_why),\n        (\"FVG\", fvg_sig, fvg_why),\n        (\"Displacement\", displacement_sig, displacement_why),\n    ]\n    candidates = []\n    for side in (\"BUY\", \"SELL\"):\n        aligned_names = [name for name, sig, _ in votes if sig == side]\n        opposed = sum(1 for _, sig, _ in votes if sig in (\"BUY\",\"SELL\") and sig != side)\n        has_structure = structure_sig == side\n        has_mss = mss_sig == side\n        has_liquidity = liq_sig == side\n        has_fvg = fvg_sig == side\n        has_displacement = displacement_sig == side\n        component_count = len(aligned_names)\n        structural_anchor = has_structure or has_mss\n        strong_combo = (\n            (has_mss and (has_structure or has_liquidity or has_fvg)) or\n            (has_structure and (has_liquidity or has_fvg or has_displacement)) or\n   \
