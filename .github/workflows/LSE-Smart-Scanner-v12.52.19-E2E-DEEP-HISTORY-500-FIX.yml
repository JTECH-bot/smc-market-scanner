        \ smc or smc.get(\"side\") not in (\"BUY\", \"SELL\"):\n        return \"WATCH\"\n    aligned = int(smc.get(\"aligned\", 0) or 0)\n    if trigger_state and trigger_state.get(\"trigger_crossed\") and rr is not None and float(rr) >= MIN_CONFIRMED_RR:\n        return \"CONFIRMED_CANDIDATE\"\n    if bool(smc.get(\"passed\")) and score >= 70 and aligned >= 3:\n        return \"SETUP_READY\"\n    if bool(smc.get(\"passed\")) or (score >= 58 and aligned >= 2):\n        return \"DEVELOPING\"\n    return \"WATCH\"\ndef smc_setup_snapshot(rows):\n    \"\"\"Compact, auditable setup evidence used by fast watch/developing alerts.\"\"\"\n    try:\n        smc = smc_core(rows)\n        sweep = liquidity_sweep_setup(rows)\n        disp, disp_why = displacement_signal(rows)\n        return {\n            \"side\": smc.get(\"side\", \"NEUTRAL\"), \"score\": float(smc.get(\"score\", 0) or 0),\n            \"passed\": bool(smc.get(\"passed\")), \"aligned\": int(smc.get(\"aligned\", 0) or 0),\n     \
